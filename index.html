<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a4f" id="theme-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --border2: #ccc8bf;
    --text: #1a1916;
    --text2: #6b6760;
    --text3: #a09d98;
    --accent: #2d6a4f;
    --accent-bg: #e8f5ee;
    --accent-hover: #245a42;
    --danger: #c0392b;
    --danger-bg: #fdf2f0;
    --warning: #b8860b;
    --warning-bg: #fdf8e8;
    --success: #2d8641;
    --success-bg: #eaf5ec;
    --tag-bg: #ede9e3;
    --tag-text: #5a5650;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --sidebar-w: 220px;
  }
  .dark {
    --bg: #141412;
    --surface: #1e1d1b;
    --surface2: #252422;
    --border: #2e2c29;
    --border2: #3a3835;
    --text: #f0ede8;
    --text2: #9a9790;
    --text3: #5a5850;
    /* --accent, --accent-bg, --accent-hover are set dynamically by applyTheme() */
    --danger: #f87171;
    --danger-bg: #2a1010;
    --warning: #fbbf24;
    --warning-bg: #2a2010;
    --success: #6bd47f;
    --success-bg: #17301f;
    --tag-bg: #2a2825;
    --tag-text: #9a9790;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; font-size: 14px; transition: background 0.2s, color 0.2s; }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100vh; position: sticky; top: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-top { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
  .app-name { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); font-family: var(--mono); }
  .sidebar-actions { display: flex; gap: 6px; margin-top: 12px; }
  .sidebar-actions button { flex: 1; font-size: 12px; padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-family: var(--font); font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .sidebar-actions button:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .weeks-list { flex: 1; overflow-y: auto; padding: 8px; }
  .week-item { padding: 8px 10px; border-radius: var(--radius); cursor: pointer; margin-bottom: 2px; transition: all 0.15s; display: flex; align-items: center; justify-content: space-between; gap: 6px; position: relative; }
  .week-item:hover { background: var(--surface2); }
  .week-item.active { background: var(--accent-bg); color: var(--accent); }
  .week-item-label { font-size: 12px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-item-count { font-size: 10px; color: var(--text3); font-family: var(--mono); flex-shrink: 0; }
  .week-item.active .week-item-count { color: var(--accent); opacity: 0.7; }
  .week-item-menu-btn { background: none; border: none; padding: 3px 5px; border-radius: 4px; cursor: pointer; color: var(--text3); line-height: 1; opacity: 0; transition: opacity 0.15s, background 0.15s; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .week-item:hover .week-item-menu-btn { opacity: 1; }
  .week-item-menu-btn:hover { background: var(--border); color: var(--text); }
  .week-menu-popover { position: absolute; top: 100%; right: 8px; margin-top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); min-width: 110px; z-index: 50; padding: 4px; display: none; }
  .week-menu-popover.open { display: block; }
  .week-menu-item { display: block; width: 100%; text-align: left; padding: 6px 10px; font-size: 12px; background: none; border: none; border-radius: 4px; cursor: pointer; color: var(--text); font-family: var(--font); }
  .week-menu-item:hover { background: var(--surface2); }
  .week-menu-item.danger { color: var(--danger); }
  .week-menu-item.danger:hover { background: var(--danger-bg); }
  .sidebar-bottom { padding: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .dark-toggle { background: none; border: 1px solid var(--border); padding: 6px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text2); font-size: 12px; font-family: var(--font); transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
  .dark-toggle:hover { background: var(--surface2); }
  .sidebar-bottom-left { display: flex; align-items: center; gap: 6px; }
  .theme-btn-wrap { position: relative; }
  .data-btns { display: flex; gap: 4px; }
  .data-btn { background: none; border: 1px solid var(--border); padding: 6px 8px; border-radius: var(--radius); cursor: pointer; color: var(--text2); font-family: var(--font); transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
  .data-btn:hover { background: var(--surface2); color: var(--text); }

  /* DRIVE SYNC */
  .drive-sync-row { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
  .drive-sync-btn { font-size: 12px; padding: 7px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-family: var(--font); font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
  .drive-sync-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .drive-sync-btn:disabled { opacity: 0.55; cursor: default; }
  .drive-sync-btn.connected { color: var(--accent); }
  .drive-status { font-size: 11px; color: var(--text3); text-align: center; min-height: 14px; }
  .drive-status.error { color: var(--danger); }
  .drive-status.syncing { color: var(--accent); }
  .theme-popover { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 8px; display: none; z-index: 100; }
  .theme-popover.open { display: flex; gap: 6px; }
  .theme-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; transition: transform 0.15s; outline: 1.5px solid var(--border); outline-offset: -1.5px; }
  .theme-swatch:hover { transform: scale(1.12); }
  .theme-swatch.active { border-color: var(--text); outline: none; }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
  #header { padding: 24px 32px 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .week-title-area { flex: 1; }
  .week-title { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .week-subtitle { font-size: 12px; color: var(--text2); margin-top: 2px; font-family: var(--mono); }
  .progress-ring-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-text { font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .header-btns { display: flex; gap: 8px; }
  .btn { padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn.btn-icon { padding: 8px 10px; }
  .btn:hover { background: var(--border); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* CONTENT */
  #content { flex: 1; overflow-y: auto; padding: 24px 32px; max-width: 860px; width: 100%; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-state p { font-size: 15px; margin-bottom: 16px; }

  /* CHECKLIST */
  .checklist { list-style: none; }
  .task-item { margin-bottom: 2px; transition: background 0.1s; }
  /* When hovered, the LI becomes a positioned stacking context with z-index 1
     so its background paints ABOVE the indent guide line (which is a positioned
     pseudo-element of the .subtask-list, painting naturally at z-index auto).
     In the default state the LI is non-positioned and the line paints over it. */
  .task-item:hover { background: var(--surface2); border-radius: var(--radius); position: relative; z-index: 1; }
  /* When the hovered task has children (the immediate next sibling is a .subtask-list,
     which contains ALL descendants of this task), extend the highlight to cover them
     too so the parent and its subtree read as one unified hover region.
     The parent gets rounded TOP corners only, the descendants' subtask-list gets
     rounded BOTTOM corners, so together they form one continuous rounded block. */
  .task-item:hover:has(+ .subtask-list) { border-radius: var(--radius) var(--radius) 0 0; }
  .task-item:hover + .subtask-list { background: var(--surface2); border-radius: 0 0 var(--radius) var(--radius); position: relative; z-index: 1; }
  .task-item:hover .task-controls { opacity: 1; }
  .task-item:hover .drag-handle { opacity: 1; }
  .task-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius); transition: background 0.1s; position: relative; }
  .drag-handle { cursor: grab; color: var(--text3); flex-shrink: 0; padding: 2px; opacity: 0; transition: opacity 0.15s; user-select: none; display: inline-flex; align-items: center; }
  .drag-handle:active { cursor: grabbing; }
  /* .dragging is SortableJS's chosenClass — applied to the row actually being
     dragged. .sortable-ghost is its ghostClass — a lightweight placeholder
     SortableJS inserts in the gap showing where the row will land if dropped
     now, replacing the old .drag-over highlight from the native-HTML5-DnD
     implementation this replaced (see initTaskSortable()). */
  .task-item.dragging { opacity: 0.4; }
  .sortable-ghost { background: var(--accent-bg) !important; border-radius: var(--radius); opacity: 0.6; }
  .sortable-ghost .task-row, .sortable-ghost .shortlist-item-row { visibility: hidden; }

  /* CHECKBOX */
  .checkbox { width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--border2); background: var(--surface); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .checkbox:hover { border-color: var(--accent); }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: ''; display: block; width: 4px; height: 8px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px, -1px); }
  .checkbox.partial { background: var(--accent-bg); border-color: var(--accent); }
  .checkbox.partial::after { content: ''; display: block; width: 8px; height: 2px; background: var(--accent); }

  /* TASK LABEL */
  /* Wrapper around the label and the inline note indicator. The wrapper takes
     the row's flex-grow space; inside, the label is sized to its text content
     so the indicator sits immediately after the title, not floating at the
     right edge of the row. min-width:0 lets the wrapper shrink when needed.
     cursor:text hints that the empty area is a click-to-focus target for
     the label (see wrapClickToFocus in JS). */
  .task-label-wrap { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; cursor: text; }
  .task-label { flex: 0 1 auto; font-size: 13.5px; color: var(--text); line-height: 1.4; cursor: text; outline: none; border-radius: 4px; padding: 1px 4px; transition: background 0.1s; }
  .task-label:focus { background: var(--surface2); }
  .task-label[data-done="true"] { color: var(--text3); text-decoration: line-through; }
  .task-label[contenteditable="true"] { cursor: text; }
  /* Small pencil indicator next to the title when a task has a note saved.
     Always visible (unlike the row-controls pencil button which is hover-only)
     so the presence of a note is glanceable. Clickable to toggle the note.
     Colored to echo the selected-week highlight: a softened accent tint by
     default, promoting to full accent + tinted background on hover. */
  .note-indicator { display: inline-flex; align-items: center; color: color-mix(in srgb, var(--accent) 55%, transparent); cursor: pointer; flex-shrink: 0; padding: 2px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
  .note-indicator:hover { color: var(--accent); background: var(--accent-bg); }
  /* Inline URLs inside a task label become clickable anchors that open in a
     new tab. Underline is dimmed so it doesn't dominate the row visually. */
  .task-link { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 2px; cursor: pointer; }
  .task-link:hover { text-decoration-color: var(--accent); }
  /* Textareas can't hold inline HTML, so URLs found in a note render below the
     textarea as small clickable pills. Styled to match the "selected week"
     look — a soft accent-tinted background with the full accent color. */
  .task-note-area { padding: 4px 8px 6px 60px; position: relative; }
  .task-note-area::before { content: ''; position: absolute; left: 42px; top: 0; bottom: 0; width: 1px; background: var(--border2); }
  /* Note editor is a contenteditable div (not a textarea) so it can hold
     inline HTML — specifically, clickable <a> tags for URLs. white-space:
     pre-wrap preserves user-typed newlines without needing <br> insertion. */
  .task-note { width: 100%; font-size: 12.5px; font-family: var(--font); color: var(--text2); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; outline: none; min-height: 36px; line-height: 1.5; box-sizing: border-box; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; cursor: text; transition: border 0.15s; }
  .task-note:focus { border-color: var(--accent); }
  /* Placeholder shows when the div is truly empty. On blur we normalize the
     contents so this stays reliable — see updateNote(). */
  .task-note:empty::before { content: attr(data-placeholder); color: var(--text3); pointer-events: none; }

  /* METADATA ROW */
  .task-meta { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 60px; flex-wrap: wrap; }
  .tag-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--tag-bg); color: var(--tag-text); font-size: 11px; padding: 2px 8px; border-radius: 99px; cursor: pointer; }
  .tag-pill:hover { background: var(--border); }
  .tag-pill .remove-tag { font-size: 10px; opacity: 0.6; }
  .due-badge { font-size: 11px; font-family: var(--mono); color: var(--text3); background: var(--surface2); padding: 2px 7px; border-radius: 99px; cursor: pointer; }
  .due-badge.overdue { color: var(--danger); background: var(--danger-bg); }
  .due-badge.soon { color: var(--warning); background: var(--warning-bg); }
  .add-tag-btn { font-size: 11px; color: var(--text3); background: none; border: 1px dashed var(--border2); padding: 2px 7px; border-radius: 99px; cursor: pointer; transition: all 0.15s; }
  .add-tag-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* NOTE */
  /* Note section: when a task has a note open, draw a thin vertical line on
     its left side that visually matches the indent connector lines. The line
     sits at x=42 of the note-area, which aligns with the task's own checkbox
     center column, making the note read as "hanging from" that checkbox. */
  .task-note-area { padding: 4px 8px 6px 60px; position: relative; }
  .task-note-area::before { content: ''; position: absolute; left: 42px; top: 0; bottom: 0; width: 1px; background: var(--border2); }

  /* CONTROLS */
  .task-controls { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
  .task-btn { background: none; border: none; padding: 5px; border-radius: 4px; cursor: pointer; color: var(--text3); line-height: 1; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
  .task-btn:hover { background: var(--surface); color: var(--text); }
  .task-btn.note-active { color: var(--accent); }
  .task-btn.danger:hover { color: var(--danger); }
  /* Mobile-only overflow menu. .task-controls above is hover-to-reveal, which
     has no reliable equivalent on a touch screen — there's no stable :hover
     state to tap into. Rather than making all four buttons always-visible
     (cramped on a narrow row), mobile swaps them for a single tap-to-open
     "..." menu (see the @media block below), which also gets Indent/Outdent
     added to it, since Tab/Shift+Tab has no touch equivalent either. Mirrors
     the existing .week-item-menu-btn / .week-menu-popover pattern one-for-one
     (same open/close mechanics, same click-outside-to-dismiss via the
     document click listener near toggleWeekMenu) rather than inventing a new
     one. Hidden on desktop by default; shown only under the breakpoint. */
  .task-menu-btn { display: none; background: none; border: none; padding: 5px; border-radius: 4px; cursor: pointer; color: var(--text3); line-height: 1; flex-shrink: 0; align-items: center; justify-content: center; }
  .task-menu-btn:hover { background: var(--surface); color: var(--text); }
  .task-menu-popover { position: absolute; top: 100%; right: 8px; margin-top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); min-width: 168px; z-index: 50; padding: 4px; display: none; }
  .task-menu-popover.open { display: block; }
  .task-menu-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 10px; font-size: 12.5px; background: none; border: none; border-radius: 4px; cursor: pointer; color: var(--text); font-family: var(--font); }
  .task-menu-item:hover { background: var(--surface2); }
  .task-menu-item.danger { color: var(--danger); }
  .task-menu-item.danger:hover { background: var(--danger-bg); }
  /* Indent has no previous sibling to become a child of; Outdent has no
     parent to move out of — renderTaskList disables the button rather than
     leaving it tappable and silently doing nothing. */
  .task-menu-item:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .task-menu-divider { height: 1px; background: var(--border); margin: 4px 2px; }
  /* Expand/collapse toggle sits at the far right of a parent task's row.
     Visually a sibling to .task-controls but with its own (always-on) opacity
     so users can see at a glance whether a task is currently collapsed. */
  .expand-toggle { background: none; border: none; padding: 5px; border-radius: 4px; cursor: pointer; color: var(--text3); line-height: 1; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .expand-toggle:hover { background: var(--surface); color: var(--text); }
  /* Star toggle to add a task to Today's Shortlist. Follows the drag-handle
     pattern: opacity 0 until the row is hovered so it doesn't add visual
     noise to un-starred rows, then always opaque + gold once starred. The
     `starred` class also fills the star polygon via currentColor. */
  .star-toggle { background: none; border: none; padding: 5px; border-radius: 4px; cursor: pointer; color: var(--text3); line-height: 1; opacity: 0; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .task-item:hover .star-toggle { opacity: 1; }
  .star-toggle:hover { color: var(--warning); background: var(--surface); }
  .star-toggle.starred { opacity: 1; color: var(--warning); }
  .star-toggle.starred svg polygon { fill: currentColor; }
  /* Today's Shortlist — a compact list of starred tasks that lives above the
     main checklist. Same underlying tasks; toggling done here toggles them
     everywhere. Hidden entirely (display:none via JS) when nothing's starred. */
  .shortlist { margin-bottom: 20px; padding: 14px 18px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); }
  .shortlist-header { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .shortlist-header::before { content: ''; display: inline-block; width: 3px; height: 12px; background: var(--warning); border-radius: 2px; }
  /* Root-level shortlist rows should land in the same horizontal spot as
     root-level main-checklist rows, so the two lists read as one aligned
     column. The card's own 18px side padding (see .shortlist above) would
     otherwise push shortlist rows 18px further right than checklist rows,
     which get no equivalent side padding from their container. Pulling the
     list flush to the card's border with a matching negative margin cancels
     that out; the header above keeps its own 18px inset untouched. */
  .shortlist-items { list-style: none; margin: 0 -18px; }
  /* Nested items under an expanded shortlist entry.
     The indent is applied as padding-left on each nested LI (not as
     padding/margin on the UL itself) and compounds naturally with each
     level of nesting, since a deeper LI sits inside its parent's already-
     indented box. This used to be duplicated as an inline style from JS
     as a defensive band-aid (see git history / HANDOFF.md) — that inline
     override turned out to be unnecessary; this rule alone is sufficient. */
  .shortlist-subitems { list-style: none; margin-top: 2px; position: relative; }
  .shortlist-subitems > .shortlist-item { padding-left: 24px; }
  /* Vertical connector line — mirrors the main checklist's own indent guide
     (.subtask-list::before, left: 42px — see its comment near .task-note-area
     for the original explanation). The convention there is: the line doesn't
     try to align with each CHILD row's checkbox; it drops straight down from
     the OWNING PARENT's own checkbox center, since the <ul> of children sits
     in the same x-coordinate frame as that parent's own row (as a sibling in
     the main list; here, nested inside the parent <li>, but the effective
     frame is identical since the <li> itself carries no left padding of its
     own — only .shortlist-subitems > .shortlist-item does, for its children).
     That parent-checkbox-center x is: 8px row padding (.shortlist-item-row)
     + 18px drag-handle/spacer width + 8px row gap + 8.5px (half the 17px
     checkbox) = 42.5px, measured from this <ul>'s own left edge — matching
     the main list's 42px almost exactly (confirmed by direct measurement:
     both come out to 42.5px in practice). Using 42px here too, both for
     consistency with the established convention and because nesting is
     self-similar: a deeper <ul>'s "own left edge" is always its immediate
     parent row's left edge, so the same 42px is correct at every depth.
     History: hardcoded to 12px pre-dates the .drag-handle.spacer fix above
     and was left stranded once that fix shifted checkboxes right. The first
     two attempts to fix it (66.5px = child checkbox center, then 58px =
     child checkbox left edge) were both chasing the wrong target — trying to
     align with the child rows instead of dropping from the parent, which is
     what the main list actually does. */
  .shortlist-subitems::before { content: ''; position: absolute; left: 42px; top: 0; bottom: 0; width: 1px; background: var(--border2); }
  /* Shortlist LI is a plain block that can hold both its row content and
     an optional child <ul> of nested items. The row itself is the flex
     container — matches the main-list task-item + task-row pattern. */
  .shortlist-item { list-style: none; display: block; }
  .shortlist-item-row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 8px; border-radius: var(--radius); min-height: 30px; }
  .shortlist-item-row:hover { background: var(--surface2); }
  /* Vertically center the small fixed-size row controls against the FIRST
     line of a wrapping label. `align-items: flex-start` on the row keeps
     everything top-aligned so a very long, multi-line label doesn't push
     the checkbox and star to the middle of a tall row. */
  .shortlist-item-row > .checkbox,
  .shortlist-item-row > .drag-handle,
  .shortlist-item-row > .star-toggle,
  .shortlist-item-row > .expand-toggle { margin-top: 1px; }
  .shortlist-label { flex: 1; font-size: 13.5px; color: var(--text); line-height: 1.4; min-width: 0; word-wrap: break-word; overflow-wrap: anywhere; cursor: text; outline: none; border-radius: 4px; padding: 1px 4px; transition: background 0.1s; }
  .shortlist-label:focus { background: var(--surface2); }
  .shortlist-label[data-done="true"] { color: var(--text3); text-decoration: line-through; }
  /* Star inside shortlist items is already the "starred" state — clicking it
     removes the item from the shortlist. Full opacity by default (no need
     to hover to see it, since it's the item's primary action). */
  .shortlist-item .star-toggle { opacity: 1; padding: 3px; }
  /* Slightly tighter chevron inside shortlist items to match the compact row. */
  .shortlist-item .expand-toggle { padding: 3px; }
  /* Drag-to-reorder visuals for root shortlist items. Mirrors main-list
     behavior: grip fades in on hover, source LI dims while dragging (SortableJS's
     chosenClass, reusing .dragging — see initShortlistSortable()), and a ghost
     placeholder (SortableJS's ghostClass, .sortable-ghost, styled up near
     .task-item.dragging) shows where the item will land. */
  .shortlist-item .drag-handle { opacity: 0; }
  .shortlist-item-row:hover .drag-handle { opacity: 1; }
  /* Nested rows get a drag-handle-shaped spacer purely to reserve the same
     leading width as a root row's real drag handle (see renderShortlistItems)
     — they aren't draggable, so this must never actually become visible or
     look interactive, unlike the real one above. */
  .shortlist-item .drag-handle.spacer { opacity: 0 !important; cursor: default; }
  .shortlist-item.dragging { opacity: 0.4; }
  /* Delete confirmation popover. Appears directly beneath the trash button
     after the user clicks it — a red X on the left to cancel, a green check
     on the right to commit. Positioned absolutely against the task-row so it
     doesn't disturb layout. The right offset accounts for the star-toggle
     (always present at the far right) plus, when the task has children,
     the expand-toggle chevron between the trash button and the star. */
  .delete-confirm { position: absolute; top: calc(100% - 2px); right: 40px; display: flex; gap: 2px; z-index: 10; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px; box-shadow: var(--shadow-md); }
  .task-item:has(.expand-toggle) .delete-confirm { right: 72px; }
  .delete-confirm-btn { background: none; border: none; padding: 4px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .delete-confirm-btn.cancel { color: var(--danger); }
  .delete-confirm-btn.confirm { color: var(--success); }
  .delete-confirm-btn.cancel:hover { background: var(--danger-bg); }
  .delete-confirm-btn.confirm:hover { background: var(--success-bg); }
  /* While the confirmation is showing on this task, keep its row controls
     visible even without hover, so the trash button remains as the anchor. */
  .task-item.pending-delete .task-controls { opacity: 1; }
  /* The pending-delete task stays visually highlighted the whole time the
     confirmation is up. This gives the floating popover an anchor and prevents
     the hover state from flickering off as the cursor moves onto the popover
     (which technically leaves the task-item's box). We mirror the same
     parent+subtree structure that :hover uses so the subtree of a parent task
     also stays highlighted (it's what would be deleted along with the parent).
     z-index is boosted above the :hover z-index of 1 so the pending task
     always sits visually above any neighboring hovered task. */
  .task-item.pending-delete { background: var(--surface2); border-radius: var(--radius); position: relative; z-index: 10; }
  .task-item.pending-delete:has(+ .subtask-list) { border-radius: var(--radius) var(--radius) 0 0; }
  .task-item.pending-delete + .subtask-list { background: var(--surface2); border-radius: 0 0 var(--radius) var(--radius); position: relative; z-index: 10; }
  /* While ANY task has a delete confirmation showing, suppress the hover
     highlight on other tasks. The popover extending down from the trash
     button unavoidably overlaps the next row visually; without this rule the
     row below would flicker to hovered whenever the cursor left the popover
     from below. :has() targets the whole document. */
  body:has(.task-item.pending-delete) .task-item:not(.pending-delete):hover { background: transparent; }
  body:has(.task-item.pending-delete) .task-item:not(.pending-delete):hover + .subtask-list { background: transparent; }

  /* CHILD TASKS */
  .subtask-list { list-style: none; padding-left: 24px; margin-top: 1px; position: relative; transition: background 0.1s; }
  .subtask-list::before { content: ''; position: absolute; left: 42px; top: 0; bottom: 0; width: 1px; background: var(--border2); }
  .subtask-list .task-label { font-size: 13px; }
  .subtask-list .subtask-list { padding-left: 22px; }

  /* ADD ROOT TASK */
  .add-root-btn { display: flex; align-items: center; gap: 8px; padding: 10px 8px; border-radius: var(--radius); border: 1.5px dashed var(--border2); color: var(--text3); background: none; font-size: 13px; font-family: var(--font); cursor: pointer; width: 100%; transition: all 0.2s; margin-top: 8px; }
  .add-root-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  /* WEEK MODAL */
  #week-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  #week-modal.open { display: flex; }
  .week-modal-box { background: var(--surface); border-radius: var(--radius-lg); padding: 28px; width: 360px; box-shadow: var(--shadow-md); }
  .week-modal-box h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .week-modal-box label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
  .week-modal-box input { width: 100%; padding: 8px 10px; font-size: 14px; font-family: var(--font); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); outline: none; margin-bottom: 12px; }
  .week-modal-box input:focus { border-color: var(--accent); }
  .carry-over-row { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; user-select: none; font-size: 12.5px; color: var(--text); }
  .carry-over-row:hover { border-color: var(--accent); }
  .carry-over-row input[type="checkbox"] { width: auto; margin: 0; padding: 0; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
  .carry-over-row strong { color: var(--text); font-weight: 600; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* SEARCH MODAL */
  #search-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 250; align-items: flex-start; justify-content: center; padding: 80px 24px 24px; }
  #search-modal.open { display: flex; }
  .search-modal-box { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); width: 100%; max-width: 640px; max-height: calc(100vh - 120px); display: flex; flex-direction: column; overflow: hidden; }
  .search-input-row { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .search-input-icon { color: var(--text3); display: inline-flex; align-items: center; }
  #search-input { flex: 1; font-size: 15px; font-family: var(--font); border: none; outline: none; background: transparent; color: var(--text); padding: 0; }
  #search-input::placeholder { color: var(--text3); }
  #search-input::-webkit-search-cancel-button { cursor: pointer; }
  .search-kbd { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; color: var(--text3); background: var(--surface2); }
  .search-results { flex: 1; overflow-y: auto; padding: 8px 0 12px; }
  .search-empty, .search-no-results { padding: 32px 24px; text-align: center; color: var(--text3); font-size: 13px; }
  .search-week-group { padding: 4px 0 8px; }
  .search-week-label { padding: 8px 20px 4px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-family: var(--mono); }
  .search-result-item { padding: 10px 20px; cursor: pointer; transition: background 0.1s, border-color 0.1s; border-left: 3px solid transparent; }
  .search-result-item:hover { background: var(--surface2); border-left-color: var(--accent); }
  .search-breadcrumb { font-size: 11px; color: var(--text3); margin-bottom: 3px; line-height: 1.4; }
  .search-task-label { font-size: 13.5px; color: var(--text); line-height: 1.4; }
  .search-task-label.done { text-decoration: line-through; color: var(--text3); }
  .search-task-note { font-size: 12px; color: var(--text2); margin-top: 4px; font-style: italic; line-height: 1.5; }
  .search-task-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .search-task-tags .tag-pill { pointer-events: none; }
  mark.search-hl { background: var(--accent-bg); color: var(--accent); padding: 1px 3px; border-radius: 3px; font-weight: 600; }

  /* Subtle persistent highlight on the task you jumped to from search.
     Uses the current theme's accent tint so it adapts to the chosen palette.
     Applied to the whole .task-item so it encompasses the row, tags, AND note.
     Stays until the next renderChecklist (any edit/toggle clears it naturally).
     position+z-index lets the highlight paint above the indent guide line. */
  .task-item.search-highlighted { background: var(--accent-bg); border-radius: var(--radius); transition: background 0.4s ease; position: relative; z-index: 1; }
  .task-item.search-highlighted:hover { background: var(--accent-bg); }

  /* TAG INPUT */
  #tag-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; align-items: center; justify-content: center; }
  #tag-modal.open { display: flex; }
  .tag-modal-box { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 300px; box-shadow: var(--shadow-md); }
  .tag-modal-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .tag-modal-box input { width: 100%; padding: 8px 10px; font-size: 14px; font-family: var(--font); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); outline: none; margin-bottom: 10px; }
  .tag-modal-box input:focus { border-color: var(--accent); }
  .tag-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag-suggestion { font-size: 12px; background: var(--tag-bg); color: var(--tag-text); padding: 3px 10px; border-radius: 99px; cursor: pointer; border: none; font-family: var(--font); }
  .tag-suggestion:hover { background: var(--accent-bg); color: var(--accent); }

  /* DRIVE MODAL (connect choice / sync conflict) */
  #drive-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  #drive-modal.open { display: flex; }
  .drive-modal-box { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 360px; max-width: 100%; box-shadow: var(--shadow-md); }
  .drive-modal-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .drive-modal-box p { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 18px; }
  .drive-modal-box .modal-btns { flex-wrap: wrap; }

  /* MOBILE NAV */
  /* Hidden on desktop; shown only under the breakpoint below. */
  .hamburger-btn { display: none; }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 149; }
  .sidebar-backdrop.open { display: block; }

  @media (max-width: 768px) {
    .hamburger-btn { display: inline-flex; }
    /* Sidebar becomes an off-canvas drawer: fixed to the left edge, slid out
       of view by default, and slid in on top of everything (above the
       backdrop, below the app's modals) when .open is toggled on. */
    #sidebar {
      position: fixed; left: 0; top: 0; z-index: 150;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      box-shadow: var(--shadow-md);
    }
    #sidebar.open { transform: translateX(0); }
    #header { padding: 16px; gap: 10px; }
    .week-title { font-size: 18px; }
    #content { padding: 16px; }
    /* Swap the desktop hover-controls for the tap-to-open overflow menu —
       see the .task-menu-btn comment above for why. */
    .task-controls { display: none; }
    .task-menu-btn { display: inline-flex; }
  }
</style>
</head>
<body>



<nav id="sidebar">
  <div class="sidebar-top">
    <div class="app-name">Weekly Tracker</div>
    <div class="sidebar-actions">
      <button onclick="openNewWeekModal()"><span data-icon="plus" data-icon-size="12"></span> New Week</button>
    </div>
  </div>
  <div class="weeks-list" id="weeks-list"></div>
  <div class="drive-sync-row">
    <button class="drive-sync-btn" id="drive-btn" onclick="driveButtonClick()">
      <span id="drive-btn-icon" data-icon="cloud" data-icon-size="14"></span>
      <span id="drive-btn-label">Connect Drive</span>
    </button>
    <div class="drive-status" id="drive-status"></div>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-bottom-left">
      <button class="dark-toggle" onclick="toggleDark()" id="dark-btn"><span id="dark-btn-icon"></span> <span id="dark-btn-label">Dark</span></button>
      <div class="theme-btn-wrap">
        <button class="data-btn" onclick="toggleThemePicker(event)" title="Change theme color"><span data-icon="palette"></span></button>
        <div class="theme-popover" id="theme-popover"></div>
      </div>
    </div>
    <div class="data-btns">
      <button class="data-btn" onclick="exportData()" title="Export all data to a backup file"><span data-icon="download"></span></button>
      <button class="data-btn" onclick="document.getElementById('import-input').click()" title="Import data from a backup file"><span data-icon="upload"></span></button>
    </div>
    <input type="file" id="import-input" accept=".json,application/json" style="display:none;" onchange="importData(event)">
  </div>
</nav>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebarMobile()"></div>

<div id="main">
  <div id="header">
    <button class="btn btn-icon hamburger-btn" onclick="toggleSidebar()" title="Menu" aria-label="Open menu"><span data-icon="menu"></span></button>
    <div class="week-title-area">
      <div class="week-title" id="week-title">Select or create a week</div>
      <div class="week-subtitle" id="week-subtitle"></div>
    </div>
    <div class="progress-ring-wrap">
      <div class="progress-text" id="progress-text"></div>
    </div>
    <div class="header-btns">
      <button class="btn btn-icon" onclick="openSearchModal()" title="Search (Ctrl+K)"><span data-icon="search"></span></button>
    </div>
  </div>
  <div id="content">
    <div class="empty-state" id="empty-state">
      <p style="margin-bottom:14px;color:var(--text3);"><span data-icon="clipboard" data-icon-size="40"></span></p>
      <p>Create a new week to get started.</p>
      <button class="btn btn-accent" onclick="openNewWeekModal()"><span data-icon="plus"></span> New Week</button>
    </div>
    <!-- Shortlist section: appears above the main list; contains all tasks
         starred as being "for today". Rendered from the same underlying
         tasks, so toggling done/star state anywhere keeps both in sync. -->
    <div id="shortlist" class="shortlist" style="display:none;">
      <div class="shortlist-header">Today's Shortlist</div>
      <ul class="shortlist-items" id="shortlist-items"></ul>
    </div>
    <ul class="checklist" id="checklist" style="display:none;"></ul>
    <button class="add-root-btn" id="add-root-btn" onclick="addRootTask()" style="display:none;">
      <span data-icon="plus" data-icon-size="16"></span> Add task
    </button>
  </div>
</div>

<!-- NEW WEEK MODAL -->
<div id="week-modal">
  <div class="week-modal-box">
    <h2 id="week-modal-title">New Week</h2>
    <label>Week label (e.g. "Week of May 26")</label>
    <input type="text" id="week-label-input" placeholder="Week of May 26" />
    <label>Date range</label>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
      <input type="date" id="week-start-input" style="flex:1;margin-bottom:0;" />
      <span style="color:var(--text3);font-size:13px;">–</span>
      <input type="date" id="week-end-input" style="flex:1;margin-bottom:0;" />
    </div>
    <label id="carry-over-row" class="carry-over-row" style="display:none;">
      <input type="checkbox" id="carry-over-checkbox" />
      <span>Carry over uncompleted tasks from <strong id="carry-over-source"></strong></span>
    </label>
    <div class="modal-btns">
      <button class="btn" onclick="closeWeekModal()">Cancel</button>
      <button class="btn btn-accent" id="week-modal-save-btn" onclick="saveWeekModal()">Create</button>
    </div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div id="search-modal">
  <div class="search-modal-box">
    <div class="search-input-row">
      <span class="search-input-icon" data-icon="search" data-icon-size="15"></span>
      <input type="search" id="search-input" placeholder="Search tasks, notes, and tags across all weeks…" autocomplete="off" oninput="runSearch(this.value)" />
      <kbd class="search-kbd">esc</kbd>
    </div>
    <div class="search-results" id="search-results">
      <div class="search-empty">Type to search across all weeks…</div>
    </div>
  </div>
</div>

<!-- TAG MODAL -->
<div id="tag-modal">
  <div class="tag-modal-box">
    <h3>Add tag</h3>
    <input type="text" id="tag-input" placeholder="Type a tag..." onkeydown="if(event.key==='Enter')saveTag()" />
    <div class="tag-suggestions" id="tag-suggestions"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-sm" onclick="closeTagModal()">Cancel</button>
      <button class="btn btn-sm btn-accent" onclick="saveTag()">Add</button>
    </div>
  </div>
</div>

<div id="drive-modal">
  <div class="drive-modal-box">
    <h3 id="drive-modal-title"></h3>
    <p id="drive-modal-text"></p>
    <div class="modal-btns" id="drive-modal-btns"></div>
  </div>
</div>

<!-- Drag-and-drop reordering (main checklist + Today's Shortlist) is handled by

let currentTheme = localStorage.getItem('wt_theme') || 'forest';
if (!THEMES[currentTheme]) currentTheme = 'forest';

function applyTheme(themeKey) {
  const theme = THEMES[themeKey] || THEMES.forest;
  const mode = document.body.classList.contains('dark') ? 'dark' : 'light';
  const c = theme[mode];
  const root = document.documentElement;
  root.style.setProperty('--accent', c.a);
  root.style.setProperty('--accent-bg', c.bg);
  root.style.setProperty('--accent-hover', c.h);
  currentTheme = themeKey;
  localStorage.setItem('wt_theme', themeKey);
  renderThemePicker();
}

function renderThemePicker() {
  const el = document.getElementById('theme-popover');
  if (!el) return;
  const mode = document.body.classList.contains('dark') ? 'dark' : 'light';
  el.innerHTML = Object.entries(THEMES).map(([key, theme]) => {
    const swatchColor = theme[mode].a;
    return `<button
      class="theme-swatch ${key === currentTheme ? 'active' : ''}"
      style="background:${swatchColor};"
      onclick="applyTheme('${key}'); event.stopPropagation();"
      title="${theme.name}"
      aria-label="${theme.name}"
    ></button>`;
  }).join('');
}

function toggleThemePicker(e) {
  e.stopPropagation();
  const popover = document.getElementById('theme-popover');
  if (!popover) return;
  const isOpen = popover.classList.contains('open');
  if (isOpen) {
    popover.classList.remove('open');
    return;
  }
  // Position above the palette button using fixed positioning (so it isn't
  // clipped by the sidebar's overflow:hidden). translateY(-100%) lifts the
  // popover up by its own height so it sits above the button.
  const button = e.currentTarget;
  if (button && button.getBoundingClientRect) {
    const rect = button.getBoundingClientRect();
    popover.style.left = rect.left + 'px';
    popover.style.top = (rect.top - 8) + 'px';
    popover.style.transform = 'translateY(-100%)';
  }
  popover.classList.add('open');
}

// Run a live search across all weeks. Matches against task labels, notes,
// and tags (case-insensitive substring). Results are grouped by week and
// most-recent-first.
function runSearch(query) {
  const resultsEl = document.getElementById('search-results');
  const q = (query || '').toLowerCase().trim();

  if (!q) {
    resultsEl.innerHTML = '<div class="search-empty">Type to search across all weeks…</div>';
    return;
  }

  const allResults = [];
  state.weeks.forEach(week => {
    const weekMatches = [];
    function walk(tasks, parents) {
      tasks.forEach(task => {
        const matched = [];
        if ((task.label || '').toLowerCase().includes(q)) matched.push('label');
        if ((task.note || '').toLowerCase().includes(q)) matched.push('note');
        if ((task.tags || []).some(t => t.toLowerCase().includes(q))) matched.push('tag');
        if (matched.length > 0) {
          weekMatches.push({ task, parents: parents.slice(), matched });
        }
        if (task.children) walk(task.children, parents.concat([task]));
      });
    }
    walk(week.tasks, []);
    if (weekMatches.length > 0) allResults.push({ week, matches: weekMatches });
  });

  if (allResults.length === 0) {
    resultsEl.innerHTML = '<div class="search-no-results">No matches for &ldquo;' + esc(query) + '&rdquo;.</div>';
    return;
  }

  resultsEl.innerHTML = allResults.map(({ week, matches }) => {
    const countLabel = matches.length + ' match' + (matches.length === 1 ? '' : 'es');
    return `<div class="search-week-group">
      <div class="search-week-label">${esc(week.label)} · ${countLabel}</div>
      ${matches.map(m => {
        const crumb = m.parents.length > 0
          ? m.parents.map(p => esc(p.label)).join(' › ')
          : '';
        const showNote = m.task.note && (m.matched.includes('note') || m.matched.includes('label') || m.matched.includes('tag'));
        return `<div class="search-result-item" onclick="navigateToTask('${week.id}', '${m.task.id}')">
          ${crumb ? `<div class="search-breadcrumb">${crumb}</div>` : ''}
          <div class="search-task-label ${m.task.done ? 'done' : ''}">${highlightMatch(m.task.label, query)}</div>
          ${showNote ? `<div class="search-task-note">${highlightMatch(m.task.note, query)}</div>` : ''}
          ${(m.task.tags && m.task.tags.length) ? `<div class="search-task-tags">${m.task.tags.map(tag =>
            `<span class="tag-pill">${highlightMatch(tag, query)}</span>`
          ).join('')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

// Wrap occurrences of `query` within `text` in <mark> tags. Walks the
// original text and escapes pieces separately so highlights survive HTML
// escaping correctly regardless of special characters in the source text.
function highlightMatch(text, query) {
  if (!text) return '';
  const q = (query || '').toLowerCase();
  if (!q) return esc(text);
  const lower = text.toLowerCase();
  let out = '';
  let i = 0;
  while (i < text.length) {
    const idx = lower.indexOf(q, i);
    if (idx === -1) { out += esc(text.slice(i)); break; }
    if (idx > i) out += esc(text.slice(i, idx));
    out += '<mark class="search-hl">' + esc(text.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out;
}

// Jump to the week and task that the user clicked in search results.
// Scrolls the task into view and gives it a subtle theme-colored highlight
// that lingers until they engage with the checklist (any edit/toggle clears it).
function navigateToTask(weekId, taskId) {
  closeSearchModal();
  selectWeek(weekId);
  setTimeout(() => {
    // The target might be inside one or more collapsed parents. Walk up the
    // chain and expand any that are hiding it, then re-render so the DOM
    // actually contains the task we're about to scroll to.
    if (expandAncestors(taskId)) renderChecklist();
    // Clear any previous search highlight first so only one item is marked at a time
    document.querySelectorAll('.task-item.search-highlighted').forEach(e => e.classList.remove('search-highlighted'));
    const el = document.querySelector(`.task-item[data-id="${taskId}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('search-highlighted');
    }
  }, 120);
}

// ─── EXPORT / IMPORT ─────────────────────────────────────────────────────────
function exportData() {
  const payload = {
    app: 'weekly-tracker',
    version: 1,
    exportedAt: new Date().toISOString(),
    state: state,
    dark: document.body.classList.contains('dark'),
    theme: currentTheme
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const today = new Date().toISOString().slice(0, 10);
  a.download = `weekly-tracker-backup-${today}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importData(event) {
  const input = event.target;
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert('Could not read that file — it doesn\'t look like valid JSON.');
      input.value = '';
      return;
    }
    // Validate shape: support both new format (with state wrapper) and direct state objects
    let importedState = null;
    let importedDark = null;
    if (data && data.state && Array.isArray(data.state.weeks)) {
      importedState = data.state;
      if (typeof data.dark === 'boolean') importedDark = data.dark;
    } else if (data && Array.isArray(data.weeks)) {
      // Allow direct state JSON too
      importedState = data;
    } else {
      alert('That file doesn\'t look like a Weekly Tracker backup. Make sure you exported it from this app.');
      input.value = '';
      return;
    }

    const newCount = importedState.weeks.length;
    const existingCount = state.weeks.length;
    let msg = `Import ${newCount} week${newCount === 1 ? '' : 's'} from this backup?`;
    if (existingCount > 0) {
      msg += `\n\nThis will REPLACE your current data (${existingCount} week${existingCount === 1 ? '' : 's'} on this device). This cannot be undone — make sure you've exported a backup first if you want to keep it.`;
    }
    if (!confirm(msg)) { input.value = ''; return; }

    state = importedState;
    save();

    if (importedDark !== null) {
      if (importedDark) document.body.classList.add('dark');
      else document.body.classList.remove('dark');
      localStorage.setItem('wt_dark', importedDark ? '1' : '0');
      updateDarkBtn();
    }
    if (data && data.theme && THEMES[data.theme]) {
      applyTheme(data.theme);
    } else {
      // Re-apply current theme in case dark mode changed
      applyTheme(currentTheme);
    }

    renderSidebar();
    const current = state.currentWeekId && state.weeks.find(w => w.id === state.currentWeekId);
    if (current) selectWeek(current.id, false);
    else if (state.weeks.length) selectWeek(state.weeks[0].id);
    else showEmpty();

    input.value = ''; // reset so the same file can be picked again later
  };
  reader.onerror = () => {
    alert('Could not read that file.');
    input.value = '';
  };
  reader.readAsText(file);
}

// ─── WEEK MANAGEMENT ─────────────────────────────────────────────────────────
let editingWeekId = null; // null = create mode, otherwise editing that week

// Format YYYY-MM-DD start/end into a display string like "May 26 – May 30, 2026"
function formatWeekRange(start, end) {
  if (!start && !end) return '';
  if (!start) return formatSingleDate(end);
  if (!end) return formatSingleDate(start);
  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  if (isNaN(s.getTime()) || isNaN(e.getTime())) return '';
  const sameYear = s.getFullYear() === e.getFullYear();
  const sameMonth = sameYear && s.getMonth() === e.getMonth();
  const year = e.getFullYear();
  if (sameMonth) {
    const month = s.toLocaleDateString('en-US', { month: 'long' });
    return `${month} ${s.getDate()} – ${e.getDate()}, ${year}`;
  }
  if (sameYear) {
    return `${s.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })} – ${e.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}, ${year}`;
  }
  return `${s.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} – ${e.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
}

function formatSingleDate(d) {
  const date = new Date(d + 'T00:00:00');
  if (isNaN(date.getTime())) return '';
  return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

// Format YYYY-MM-DD into "Week of May 26"
function defaultLabelFromDate(d) {
  const date = new Date(d + 'T00:00:00');
  if (isNaN(date.getTime())) return 'Untitled Week';
  return 'Week of ' + date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// Today as YYYY-MM-DD (in local time)
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDaysISO(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function openNewWeekModal() {
  editingWeekId = null;
  const start = todayISO();
  const end = addDaysISO(start, 4); // default to 5-day work week
  document.getElementById('week-modal-title').textContent = 'New Week';
  document.getElementById('week-modal-save-btn').textContent = 'Create';
  document.getElementById('week-label-input').value = defaultLabelFromDate(start);
  document.getElementById('week-start-input').value = start;
  document.getElementById('week-end-input').value = end;

  // Show carry-over option only when there's a previous week to copy from
  const carryRow = document.getElementById('carry-over-row');
  const carryCheckbox = document.getElementById('carry-over-checkbox');
  carryCheckbox.checked = false; // always start unchecked
  if (state.weeks.length > 0) {
    document.getElementById('carry-over-source').textContent = state.weeks[0].label;
    carryRow.style.display = 'flex';
  } else {
    carryRow.style.display = 'none';
  }

  document.getElementById('week-modal').classList.add('open');
  setTimeout(() => document.getElementById('week-label-input').select(), 50);
}

function openEditWeekModal(id) {
  closeAllWeekMenus();
  const w = state.weeks.find(w => w.id === id);
  if (!w) return;
  editingWeekId = id;
  document.getElementById('week-modal-title').textContent = 'Edit Week';
  document.getElementById('week-modal-save-btn').textContent = 'Save';
  document.getElementById('week-label-input').value = w.label || '';
  document.getElementById('week-start-input').value = w.rangeStart || '';
  document.getElementById('week-end-input').value = w.rangeEnd || '';
  document.getElementById('carry-over-row').style.display = 'none'; // not relevant when editing
  document.getElementById('week-modal').classList.add('open');
  setTimeout(() => document.getElementById('week-label-input').select(), 50);
}

function closeWeekModal() {
  document.getElementById('week-modal').classList.remove('open');
  editingWeekId = null;
}

function saveWeekModal() {
  const label = document.getElementById('week-label-input').value.trim() || 'Untitled Week';
  const rangeStart = document.getElementById('week-start-input').value;
  const rangeEnd = document.getElementById('week-end-input').value;
  const range = formatWeekRange(rangeStart, rangeEnd);

  if (editingWeekId) {
    const w = state.weeks.find(w => w.id === editingWeekId);
    if (w) {
      w.label = label;
      w.range = range;
      w.rangeStart = rangeStart;
      w.rangeEnd = rangeEnd;
    }
    save();
    closeWeekModal();
    renderSidebar();
    if (state.currentWeekId === editingWeekId) {
      document.getElementById('week-title').textContent = label;
      document.getElementById('week-subtitle').textContent = range;
    }
    editingWeekId = null;
  } else {
    // Capture carry-over preference BEFORE we unshift the new week onto state.weeks
    // (otherwise state.weeks[0] would be the brand-new empty week, not the previous one).
    const carryCheckbox = document.getElementById('carry-over-checkbox');
    const carryOver = carryCheckbox && carryCheckbox.checked && state.weeks.length > 0;
    const carriedTasks = carryOver ? copyUncompletedTasks(state.weeks[0].tasks) : [];
    const week = { id: uid(), label, range, rangeStart, rangeEnd, tasks: carriedTasks, createdAt: Date.now() };
    state.weeks.unshift(week);
    save();
    closeWeekModal();
    selectWeek(week.id);
    renderSidebar();
  }
}

function deleteWeek(id) {
  closeAllWeekMenus();
  const w = state.weeks.find(w => w.id === id);
  if (!w) return;
  if (!confirm('Delete "' + w.label + '"? This cannot be undone.')) return;
  state.weeks = state.weeks.filter(w => w.id !== id);
  if (state.currentWeekId === id) {
    state.currentWeekId = state.weeks.length ? state.weeks[0].id : null;
  }
  save();
  renderSidebar();
  if (state.currentWeekId) selectWeek(state.currentWeekId, false);
  else showEmpty();
}
