  document.getElementById('progress-text').textContent = '';
}

function selectWeek(id, doSave = true) {
  state.currentWeekId = id;
  if (doSave) save();
  renderSidebar();
  const week = state.weeks.find(w => w.id === id);
  closeSidebarMobile(); // on mobile the sidebar is an overlay drawer; picking a week should dismiss it
  if (!week) return;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('checklist').style.display = '';
  document.getElementById('add-root-btn').style.display = '';
  document.getElementById('week-title').textContent = week.label;
  document.getElementById('week-subtitle').textContent = week.range || '';
  renderChecklist();
  updateProgress();
}

// ─── MOBILE SIDEBAR ──────────────────────────────────────────────────────────
// Below the CSS breakpoint, #sidebar becomes a fixed off-canvas drawer
// (see the "MOBILE NAV" styles) instead of the always-visible desktop column.
// These just toggle the .open class on the sidebar and its backdrop; above
// the breakpoint the class has no visual effect, so it's safe to call
// unconditionally (e.g. from selectWeek) on any screen size.
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (!sb) return;
  const opening = !sb.classList.contains('open');
  sb.classList.toggle('open', opening);
  if (bd) bd.classList.toggle('open', opening);
}
function closeSidebarMobile() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (sb) sb.classList.remove('open');
  if (bd) bd.classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSidebarMobile();
});

function renderSidebar() {
  const list = document.getElementById('weeks-list');
  if (!state.weeks.length) { list.innerHTML = '<div style="padding:16px 12px;font-size:12px;color:var(--text3);">No weeks yet.</div>'; return; }
  list.innerHTML = state.weeks.map(w => {
    const total = countAll(w.tasks);
    const done = countDone(w.tasks);
    return `<div class="week-item ${w.id === state.currentWeekId ? 'active' : ''}" onclick="selectWeek('${w.id}')">
      <span class="week-item-label">${esc(w.label)}</span>
      <span class="week-item-count">${done}/${total}</span>
      <button class="week-item-menu-btn" onclick="toggleWeekMenu(event, '${w.id}')" title="More options" aria-label="Week options">${icon('more', 14)}</button>
      <div class="week-menu-popover" id="week-menu-${w.id}" onclick="event.stopPropagation()">
        <button class="week-menu-item" onclick="openEditWeekModal('${w.id}')">Edit</button>
        <button class="week-menu-item danger" onclick="deleteWeek('${w.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ─── TASK HELPERS ─────────────────────────────────────────────────────────────
function currentWeek() { return state.weeks.find(w => w.id === state.currentWeekId); }
function newTask(label='') { return { id: uid(), label, done: false, note: '', tags: [], due: '', children: [] }; }

// Deep-copy the uncompleted tasks from a list, preserving hierarchy. Used for
// the "carry over" feature when creating a new week.
//   - Skips done tasks
//   - Preserves label, notes, and tags (context); resets due dates (time-specific)
//   - Drops parents whose original children were all completed (the parent has
//     no remaining work even if its own .done flag was somehow false)
function copyUncompletedTasks(tasks) {
  const result = [];
  tasks.forEach(t => {
    if (t.done) return;
    const newChildren = t.children ? copyUncompletedTasks(t.children) : [];
    // If the original task had children but none remain uncompleted, the work
    // is effectively done — skip rather than carry over an empty parent.
    if (t.children && t.children.length > 0 && newChildren.length === 0) return;
    result.push({
      id: uid(),
      label: t.label,
      done: false,
      note: t.note || '',
      tags: t.tags ? t.tags.slice() : [],
      due: '',
      children: newChildren
    });
  });
  return result;
}

function countAll(tasks) {
  let n = 0;
  tasks.forEach(t => { n++; if (t.children) n += countAll(t.children); });
  return n;
}
function countDone(tasks) {
  let n = 0;
  tasks.forEach(t => { if (t.done) n++; if (t.children) n += countDone(t.children); });
  return n;
}

function findTask(tasks, id) {
  for (const t of tasks) {
    if (t.id === id) return t;
    if (t.children) { const f = findTask(t.children, id); if (f) return f; }
  }
  return null;
}

function findParent(tasks, id, parent=null) {
  for (const t of tasks) {
    if (t.id === id) return parent;
    if (t.children) {
      const f = findParent(t.children, id, t);
      if (f !== undefined) return f;
    }
  }
  return undefined;
}

function removeTask(tasks, id) {
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].id === id) { tasks.splice(i, 1); return true; }
    if (tasks[i].children && removeTask(tasks[i].children, id)) return true;
  }
  return false;
}

function setAllChildren(task, done) {
  task.done = done;
  if (task.children) task.children.forEach(c => setAllChildren(c, done));
}

function syncParents(tasks, id) {
  for (const t of tasks) {
    if (t.children && t.children.length) {
      const found = syncParents(t.children, id);
      if (found) {
        const allDone = t.children.every(c => c.done);
        const anyDone = t.children.some(c => c.done);
        t.done = allDone;
        return true;
      }
    }
    if (t.id === id) return true;
  }
  return false;
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function updateProgress() {
  const w = currentWeek();
  if (!w) return;
  const total = countAll(w.tasks);
  const done = countDone(w.tasks);
  document.getElementById('progress-text').textContent = total ? `${done} / ${total} done` : '';
  renderSidebar();
}

// ─── ADD / EDIT TASKS ────────────────────────────────────────────────────────
function addRootTask() {
  const w = currentWeek(); if (!w) return;
  const t = newTask('New task');
  w.tasks.push(t);
  save();
  renderChecklist();
  updateProgress();
  // Focus label
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${t.id}"] .task-label`);
    if (el) { el.focus(); selectAll(el); }
  }, 30);
}

function addChildTask(parentId) {
  const w = currentWeek(); if (!w) return;
  const parent = findTask(w.tasks, parentId);
  if (!parent) return;
  if (!parent.children) parent.children = [];
  const t = newTask('New task');
  parent.children.push(t);
  save();
  renderChecklist();
  updateProgress();
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${t.id}"] .task-label`);
    if (el) { el.focus(); selectAll(el); }
  }, 30);
}

function selectAll(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ─── DELETE WITH CONFIRMATION ────────────────────────────────────────────────
// Clicking the trash button opens a small confirmation popover under it
// instead of deleting immediately. Green check commits; red X cancels.
// Clicking trash again while the popover is showing also cancels.
// (pendingDeleteId is declared at the top of the script alongside other state.)

function deleteTask(id) {
  // If the popover is already up for THIS task, treat the second click as cancel.
  if (pendingDeleteId === id) { pendingDeleteId = null; renderChecklist(); return; }
  // Otherwise (nothing pending, or pending on a different task) open it here.
  pendingDeleteId = id;
  renderChecklist();
}

function confirmDelete(id) {
  const w = currentWeek(); if (!w) return;
  pendingDeleteId = null;
  removeTask(w.tasks, id);
  save();
  renderChecklist();
  updateProgress();
}

function cancelDelete() {
  pendingDeleteId = null;
  renderChecklist();
}

// Click anywhere else on the page (outside the confirm popover and outside
// the trash button that opened it) to dismiss the pending confirmation.
document.addEventListener('click', (e) => {
  if (!pendingDeleteId) return;
  if (e.target.closest('.delete-confirm, .task-btn.danger')) return;
  pendingDeleteId = null;
  renderChecklist();
});

function toggleDone(id) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (!t) return;
  const newDone = !t.done;
  setAllChildren(t, newDone);
  syncParents(w.tasks, id);
  save();
  renderChecklist();
  updateProgress();
}

function updateLabel(id, value, isBlur) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (t) { t.label = value; save(); }
  // Mirror the change to whichever view of this task ISN'T currently being
  // edited, so both stay in sync in real time as the user types. On blur
  // we re-linkify (URLs become clickable anchors); on input we escape only
  // (linkify would clobber the caret on the currently-edited element, but
  // for the mirror view we still want it plain-text until commit).
  const rendered = isBlur ? linkify(value) : esc(value);
  const mainLabel = document.querySelector(`.task-item[data-id="${id}"] .task-label`);
  const shortlistLabel = document.querySelector(`.shortlist-item[data-id="${id}"] .shortlist-label`);
  if (mainLabel && !mainLabel.matches(':focus')) mainLabel.innerHTML = rendered;
  if (shortlistLabel && !shortlistLabel.matches(':focus')) shortlistLabel.innerHTML = rendered;
  // Keep the strike-through state (data-done) fresh on both views too.
  if (t) {
    if (mainLabel) mainLabel.setAttribute('data-done', String(!!t.done));
    if (shortlistLabel) shortlistLabel.setAttribute('data-done', String(!!t.done));
  }
}

// Empty space inside the label wrapper (between/after the label text and the
// optional note-indicator) should behave as a click-to-focus target for the
// label. If the click actually hit the label or the indicator, their own
// handlers deal with it; only bare-wrapper clicks route to the label focus.
function wrapClickToFocus(event, wrap) {
  if (event.target !== wrap) return;
  const label = wrap.querySelector('.task-label');
  if (label) {
    label.focus();
    // Place caret at end so typing continues after existing text
    const range = document.createRange();
    range.selectNodeContents(label);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

// Clicking a link inside a contenteditable label would normally focus the
// label first (via mousedown default), which flashes the caret and steals
// focus from the intended navigation. Suppress that default on mousedown.
// A separate click listener then opens the URL, because within a
// contenteditable the browser treats clicks on anchor tags as caret
// placement and swallows the anchor's default navigate action — we have
// to trigger it ourselves.
//
// Note-link-chips are plain anchors OUTSIDE any contenteditable, so we let
// the browser handle them natively via target="_blank". Applying the same
// mousedown preventDefault to them was interfering with the normal
// click-to-navigate flow in some browsers.
document.addEventListener('mousedown', (e) => {
  if (e.target.closest('.task-link')) e.preventDefault();
});
document.addEventListener('click', (e) => {
  const link = e.target.closest('.task-link');
  if (link && link.href) {
    e.preventDefault();
    e.stopPropagation();
    window.open(link.href, '_blank', 'noopener,noreferrer');
  }
});
// Pasting into the label or note contenteditables should insert plain text
// only. Otherwise formatted paste from Word/browsers ends up as arbitrary
// HTML in the DOM — messes with linkification, styling, and the innerText
// we save. We intercept, extract the plaintext, and insert it at the caret.
document.addEventListener('paste', (e) => {
  const t = e.target;
  if (!t.classList || (!t.classList.contains('task-note') && !t.classList.contains('task-label') && !t.classList.contains('shortlist-label'))) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  if (!text) return;
  const sel = window.getSelection();
  if (sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
  // Fire input so the surrounding save handlers pick it up.
  t.dispatchEvent(new Event('input', { bubbles: true }));
});

function updateNote(id, value, isBlur) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (t) { t.note = value; save(); }
  // Show/hide the "Has a note" pencil indicator next to the title. This
  // runs on every input, so emptying the note (or typing the first char
  // into an empty note) updates the indicator without a full re-render.
  const wrap = document.querySelector(`.task-item[data-id="${id}"] .task-label-wrap`);
  if (wrap) {
    const existing = wrap.querySelector('.note-indicator');
    const shouldShow = value && value.trim() !== '';
    if (shouldShow && !existing) {
      const span = document.createElement('span');
      span.className = 'note-indicator';
      span.title = 'Has a note (click to toggle)';
      span.innerHTML = icon('pencil', 13);
      span.onclick = (e) => { e.stopPropagation(); toggleNote(id); };
      wrap.appendChild(span);
    } else if (!shouldShow && existing) {
      existing.remove();
    }
  }
  // On blur, re-linkify the note's DOM in place: any URLs the user typed
  // become clickable <a> tags. Skip if still focused (would clobber the
  // caret). Also normalize empty content so :empty::before placeholder
  // reliably shows — contenteditable often leaves stray <br> after all
  // text is deleted, which prevents the :empty selector from matching.
  if (isBlur) {
    const noteEl = document.querySelector(`[data-id="${id}"] .task-note`);
    if (noteEl && !noteEl.matches(':focus')) {
      noteEl.innerHTML = value && value.trim() ? linkify(value) : '';
    }
  }
}

function autoResizeNote(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function toggleNote(id) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (!t) return;
  // Use the same fallback rendering uses (undefined → infer from content) so
  // the first toggle on a pre-existing note behaves as the user expects.
  const wasOpen = t.noteOpen !== undefined ? !!t.noteOpen : !!t.note;
  t.noteOpen = !wasOpen;
  save();
  renderChecklist();
  // If we just opened it, focus the note editor and drop the caret at the
  // end of any existing content so the user can start typing straight away.
  if (t.noteOpen) {
    setTimeout(() => {
      const noteEl = document.querySelector(`[data-id="${id}"] .task-note`);
      if (!noteEl) return;
      noteEl.focus();
      const range = document.createRange();
      range.selectNodeContents(noteEl);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 30);
  }
}

// Shortlist labels are contenteditable so they can be edited in place;
// updateLabel is wired via onblur/oninput and mirrors edits to the main
// list. This just handles keys that should commit the edit: Enter and
// Escape both blur the field. Structural keys (Tab, arrows) are left as
// browser defaults inside the shortlist to avoid surprises — reordering
// happens via drag, and hierarchy edits belong in the main list.
function handleShortlistLabelKeydown(e) {
  if (e.key === 'Enter' || e.key === 'Escape') {
    e.preventDefault();
    e.target.blur();
  }
}

// ─── KEYBOARD TASK NAVIGATION ────────────────────────────────────────────────
// Enter → add sibling task after current; Tab → indent (make child of previous sibling); Shift+Tab → unindent
function handleTaskKeydown(e, id) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const label = e.target.textContent.trim();
    updateLabel(id, label);
    addSiblingTask(id);
  } else if (e.key === 'Tab') {
    e.preventDefault();
    if (e.shiftKey) {
      unindentTask(id);
    } else {
      indentTask(id);
    }
  } else if (e.key === 'ArrowUp') {
    // Move to previous task's label — but only if the caret is on the
    // first visual line of the current label (so multi-line labels can
    // still be navigated internally with Up).
    if (isCaretOnFirstLine(e.target)) {
      e.preventDefault();
      focusAdjacentTaskLabel(id, -1);
    }
  } else if (e.key === 'ArrowDown') {
    if (isCaretOnLastLine(e.target)) {
      e.preventDefault();
      focusAdjacentTaskLabel(id, 1);
    }
  }
}

// Walk the DOM in visual order (the query selector returns rendered items
// only — collapsed parents' children are excluded automatically) and focus
// the label of the task adjacent to `currentId` in the given direction.
// direction: -1 for previous, +1 for next.
function focusAdjacentTaskLabel(currentId, direction) {
  const allItems = Array.from(document.querySelectorAll('.task-item'));
  const idx = allItems.findIndex(el => el.dataset.id === currentId);
  if (idx === -1) return;
  const target = allItems[idx + direction];
  if (!target) return;
  const targetLabel = target.querySelector('.task-label');
  if (!targetLabel) return;
  targetLabel.focus();
  // Place caret at end when arriving from below (going Up), at start when
  // arriving from above (going Down). Matches how a caret naturally crosses
  // paragraph boundaries in a text editor.
  const range = document.createRange();
  if (direction === -1) {
    range.selectNodeContents(targetLabel);
    range.collapse(false);
  } else {
    range.setStart(targetLabel, 0);
    range.collapse(true);
  }
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  // Keep the target in view if it's scrolled off-screen
  targetLabel.closest('.task-item').scrollIntoView({ block: 'nearest' });
}

// Compare the caret's y-position to the containing element's top/bottom.
// If it's within roughly half a line-height, it's on the first/last visual
// line — meaning an ArrowUp/Down should exit to the neighboring task rather
// than move within the label. Handles the empty-label case (zero-size rect).
function isCaretOnFirstLine(el) {
  const sel = window.getSelection();
  if (sel.rangeCount === 0) return true;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return false;
  const caret = range.getBoundingClientRect();
  const box = el.getBoundingClientRect();
  if (caret.top === 0 && caret.bottom === 0) return true;
  const lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
  return caret.top - box.top < lh * 0.75;
}
function isCaretOnLastLine(el) {
  const sel = window.getSelection();
  if (sel.rangeCount === 0) return true;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return false;
  const caret = range.getBoundingClientRect();
  const box = el.getBoundingClientRect();
  if (caret.top === 0 && caret.bottom === 0) return true;
  const lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
  return box.bottom - caret.bottom < lh * 0.75;
}

// Add a new task at the same level, right after the given task
function addSiblingTask(id) {
  const w = currentWeek(); if (!w) return;
  const info = findListContaining(w.tasks, id);
  if (!info) return;
  const t = newTask('');
  info.list.splice(info.index + 1, 0, t);
  save();
  renderChecklist();
  updateProgress();
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${t.id}"] .task-label`);
    if (el) { el.focus(); }
  }, 30);
}

// Click the chevron handle on a parent task to show/hide its children.
// The collapsed flag persists with the task in localStorage.
function toggleCollapse(id) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (!t) return;
  t.collapsed = !t.collapsed;
  save();
  renderChecklist();
}

// Walk up from a task and force every ancestor to be expanded.
// Used when jumping to a search result that might be inside collapsed parents.
function expandAncestors(id) {
  const w = currentWeek(); if (!w) return;
  let changed = false;
  let parent = findParent(w.tasks, id);
  while (parent) {
    if (parent.collapsed) { parent.collapsed = false; changed = true; }
    parent = findParent(w.tasks, parent.id);
  }
  if (changed) save();
  return changed;
}

// Tab: make current task a child of the task immediately above it (at same level)
function indentTask(id) {
  const w = currentWeek(); if (!w) return;
  const info = findListContaining(w.tasks, id);
  if (!info || info.index === 0) return; // no previous sibling
  const prevSibling = info.list[info.index - 1];
  const [task] = info.list.splice(info.index, 1);
  if (!prevSibling.children) prevSibling.children = [];
  prevSibling.children.push(task);
  // Auto-expand the new parent so the user sees the indented task land in it.
  prevSibling.collapsed = false;
  save();
  renderChecklist();
  updateProgress();
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${id}"] .task-label`);
    if (el) el.focus();
  }, 30);
}

// Shift+Tab: move task out of its parent, placing it after the parent
function unindentTask(id) {
  const w = currentWeek(); if (!w) return;
  // Find parent
  const parent = findParent(w.tasks, id);
  if (!parent) return; // already at root level
  const parentInfo = findListContaining(w.tasks, parent.id);
  if (!parentInfo) return;
  const childInfo = findListContaining(parent.children, id);
  if (!childInfo) return;
  const [task] = parent.children.splice(childInfo.index, 1);
  // Insert after parent in parent's list
  parentInfo.list.splice(parentInfo.index + 1, 0, task);
  save();
  renderChecklist();
  updateProgress();
  setTimeout(() => {
    const el = document.querySelector(`[data-id="${id}"] .task-label`);
    if (el) el.focus();
  }, 30);
}

// ─── DUE DATES ───────────────────────────────────────────────────────────────
function setDue(id, evt) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (!t) return;

  // Reuse or create a tiny date input. It needs a non-zero rendered size or some
  // browsers won't show the native picker; positioning it at the click target makes
  // the picker dialog open aligned with the button instead of in the top-left corner.
  let picker = document.getElementById('date-picker-input');
  if (!picker) {
    picker = document.createElement('input');
    picker.type = 'date';
    picker.id = 'date-picker-input';
    picker.style.cssText = 'position:fixed; opacity:0; width:1px; height:1px; padding:0; margin:0; border:none; background:transparent;';
    document.body.appendChild(picker);
  }

  // event.target can be the SVG icon or its child <path>; walk up to the actual
  // button/badge so we anchor to a stable rect rather than a tiny SVG segment.
  let target = evt && evt.currentTarget;
  if ((!target || !target.getBoundingClientRect) && evt && evt.target && evt.target.closest) {
    target = evt.target.closest('button, .due-badge');
  }

  if (target && target.getBoundingClientRect) {
    const rect = target.getBoundingClientRect();
    picker.style.left = rect.left + 'px';
    picker.style.top = (rect.bottom + 4) + 'px';
  }
  // Force a layout/reflow so the input's new position is committed before
  // showPicker reads it to position the picker dialog.
  picker.getBoundingClientRect();

  picker.value = t.due || '';

  picker.onchange = () => {
    t.due = picker.value; // YYYY-MM-DD from the input
    save();
    renderChecklist();
    picker.onchange = null;
  };

  // Focus first so the picker uses this input as its anchor (some browsers
  // anchor the popup to the focused element rather than the originating one).
  try { picker.focus({ preventScroll: true }); } catch(e) { picker.focus(); }
  if (typeof picker.showPicker === 'function') {
    try { picker.showPicker(); }
    catch(e) { picker.click(); }
  } else {
    picker.click();
  }
}

function dueBadgeClass(due) {
  if (!due) return '';
  const d = new Date(due + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((d - now) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 2) return 'soon';
  return '';
}

function formatDue(due) {
  if (!due) return '';
  try {
    const [y, m, d] = due.split('-');
    return `${m}-${d}-${y}`;
  } catch(e) { return due; }
}

// ─── TAGS ────────────────────────────────────────────────────────────────────
function allTags() {
  const tags = new Set();
  state.weeks.forEach(w => {
    function collect(tasks) { tasks.forEach(t => { (t.tags||[]).forEach(tag => tags.add(tag)); if (t.children) collect(t.children); }); }
    collect(w.tasks);
  });
  return [...tags];
}

function openTagModal(id) {
  tagModalTarget = id;
  const suggestions = allTags();
  document.getElementById('tag-input').value = '';
  document.getElementById('tag-suggestions').innerHTML = suggestions.map(s =>
    `<button class="tag-suggestion" onclick="quickTag('${esc(s)}')">${esc(s)}</button>`
  ).join('');
  document.getElementById('tag-modal').classList.add('open');
  setTimeout(() => document.getElementById('tag-input').focus(), 50);
}
function closeTagModal() { document.getElementById('tag-modal').classList.remove('open'); tagModalTarget = null; }
function quickTag(tag) {
  document.getElementById('tag-input').value = tag;
  saveTag();
}
function saveTag() {
  const val = document.getElementById('tag-input').value.trim();
  if (!val || !tagModalTarget) { closeTagModal(); return; }
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, tagModalTarget);
  if (t) {
    if (!t.tags) t.tags = [];
    if (!t.tags.includes(val)) t.tags.push(val);
    save();
    renderChecklist();
  }
  closeTagModal();
}
function removeTag(id, tag) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (t && t.tags) { t.tags = t.tags.filter(tg => tg !== tag); save(); renderChecklist(); }
}

// ─── DRAG AND DROP (main checklist) ──────────────────────────────────────────
// Reordering/reparenting via drag is handled by SortableJS rather than the
// browser's native HTML5 drag-and-drop API — see the comment above the
// SortableJS <script> tag near the top of the file for why. SortableJS moves
// the real DOM nodes live as the user drags; once they drop, onSortEnd below
// just reads the resulting DOM order back into `state` (rather than trying to
// patch the data model to match a computed source/target pair), then does a
// normal save()+renderChecklist() same as every other mutation in this file.
//
// Every list level (the root <ul class="checklist"> and every nested
// <ul class="subtask-list">) shares one Sortable `group` name, so an item can
// be dragged from anywhere in the tree and dropped anywhere else in the tree —
// matching what the old native-drag implementation supported (drop onto a row
// to land as its new sibling, at any depth), just now working on touch too.
// A collapsed parent's children list isn't in the DOM at all (renderTaskList
// skips rendering it), so it's simply not a drop target while collapsed —
// same limitation the old implementation had.
function findListContaining(tasks, id) {
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].id === id) return { list: tasks, index: i };
    if (tasks[i].children) {
      const r = findListContaining(tasks[i].children, id);
      if (r) return r;
    }
  }
  return null;
}

// A task's subtask-list <ul> is rendered as a SIBLING immediately following
// its own <li> in the DOM — not nested inside it (see renderTaskList: the li
// and its subUl are both appended to the same `container`). The hover/pending
// -delete "merge into one rounded block" CSS relies on this exact adjacency
// (`.task-item + .subtask-list` and friends). SortableJS only physically
// moves the dragged <li> itself, so when a task that OWNS a subtask-list is
// dragged, its <ul> gets left behind next to wherever the li used to be,
// no longer adjacent to its owner. reattachSubtaskLists() repairs that after
// every drag, before we read the tree back out of the DOM: each subtask-list
// is tagged with data-parent-id when rendered (see renderTaskList), so we can
// always find its rightful owner <li> and move the <ul> to sit right after it
// again (moving a node that's already elsewhere in the DOM re-parents it,
// bringing its whole subtree — including further-nested subtask-lists —
// along for free).
function reattachSubtaskLists() {
  const root = document.getElementById('checklist');
  if (!root) return;
  const liById = new Map();
  root.querySelectorAll('.task-item').forEach(li => liById.set(li.dataset.id, li));
  root.querySelectorAll('ul.subtask-list[data-parent-id]').forEach(ul => {
    const li = liById.get(ul.dataset.parentId);
    if (li && li.nextElementSibling !== ul) li.after(ul);
  });
}

// Re-derive w.tasks' shape from the current (post-drag) DOM order. Walks each
// <ul> depth-first; for a task whose subtask-list IS present in the DOM
// (immediately following its <li>, per reattachSubtaskLists() above), its
// children are rebuilt from that list (so a drag that emptied it, or moved
// items into it, is captured). For a task with NO subtask-list in the DOM —
// because it truly has no children, OR because it's currently collapsed and
// its children just aren't rendered right now — t.children is left completely
// untouched, so a collapsed parent's hidden subtree is never at risk of being
// wiped out by a drag that happened elsewhere in the tree.
function rebuildTaskTreeFromChecklistDOM() {
  const w = currentWeek(); if (!w) return;
  reattachSubtaskLists();
  const byId = new Map();
  (function index(tasks) {
    tasks.forEach(t => { byId.set(t.id, t); if (t.children) index(t.children); });
  })(w.tasks);
  function walk(ul) {
    const out = [];
    Array.from(ul.children).forEach(li => {
      if (!li.classList || !li.classList.contains('task-item')) return;
      const task = byId.get(li.dataset.id);
      if (!task) return;
      const next = li.nextElementSibling;
      if (next && next.tagName === 'UL' && next.classList.contains('subtask-list') && next.dataset.parentId === li.dataset.id) {
        task.children = walk(next);
      }
      out.push(task);
    });
    return out;
  }
  w.tasks = walk(document.getElementById('checklist'));
}

function handleTaskSortEnd() {
  rebuildTaskTreeFromChecklistDOM();
  save();
  renderChecklist();
  updateProgress();
}

// Create (or re-create, after a re-render) a Sortable instance on every
// checklist-level <ul> currently in the DOM. Safe to call after every render:
// old instances simply go away with the old (now-detached) DOM nodes they were
// attached to, same as how the old dragstart/dragend listeners were re-bound
// fresh on every render rather than explicitly torn down.
function initTaskSortable() {
  document.querySelectorAll('#checklist, .subtask-list').forEach(ul => {
    Sortable.create(ul, {
      group: 'main-checklist',
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      chosenClass: 'dragging',
      fallbackOnBody: true,
      onEnd: handleTaskSortEnd
    });
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Escape non-URL text and wrap detected http(s) URLs in anchor tags that open
// in a new tab. Used inline in task labels (which are contenteditable divs).
// Also see extractUrls() for pulling URLs out of note text (textareas can't
// hold inline HTML, so notes get clickable link chips rendered below them).
function linkify(s) {
  if (!s) return '';
  const re = /(https?:\/\/[^\s<>"']+)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s)) !== null) {
    out += esc(s.slice(last, m.index));
    const url = m[0];
    out += `<a class="task-link" href="${url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer" title="Open in new tab">${esc(url)}</a>`;
    last = m.index + url.length;
  }
  out += esc(s.slice(last));
  return out;
}
function extractUrls(s) {
  if (!s) return [];
  return s.match(/(https?:\/\/[^\s<>"']+)/g) || [];
}

function renderTaskList(tasks, container, depth = 0) {
  tasks.forEach((t, idx) => {
    const li = document.createElement('li');
    li.className = 'task-item';
    if (t.id === pendingDeleteId) li.classList.add('pending-delete');
    li.dataset.id = t.id;
    // Draggability is wired up by initTaskSortable() (SortableJS) after the
    // whole list is rendered, not per-item here — see the DRAG AND DROP section.

    const hasChildren = t.children && t.children.length > 0;
    const isPartial = hasChildren && t.children.some(c => c.done) && !t.children.every(c => c.done);
    const checkClass = t.done ? 'checked' : (isPartial ? 'partial' : '');

    // A task has TWO distinct "note" states:
    //   • hasNote  — whether the task holds any note content. Drives the small
    //     pencil indicator next to the title so users can see at a glance which
    //     tasks have notes even when their note section is closed.
    //   • noteOpen — whether the note section is currently displayed. This is
    //     a PERSISTENT per-task flag that only changes when the user clicks
    //     the note icon. Rendering the task (e.g. when expanding a parent)
    //     doesn't reset it, so a note the user closed stays closed.
    // For tasks predating this feature, noteOpen is undefined; we infer from
    // content to preserve the previous "notes with content are shown" behavior.
    // Once the user toggles explicitly, the stored flag takes over.
    const hasNote = !!t.note;
    const noteOpen = t.noteOpen !== undefined ? !!t.noteOpen : hasNote;

    // Each task has a `collapsed` flag (default false). When collapsed, the
    // children subtask-list isn't rendered. The toggle lives at the FAR RIGHT
    // of the task-row, only present for tasks that actually have children.
    const isCollapsed = !!t.collapsed;
    const expandToggle = hasChildren
      ? `<button class="expand-toggle" onclick="toggleCollapse('${t.id}')" title="${isCollapsed ? 'Expand' : 'Collapse'}">${icon(isCollapsed ? 'chevron-left' : 'chevron-down', 14)}</button>`
      : '';

    li.innerHTML = `
      <div class="task-row">
        <span class="drag-handle" title="Drag to reorder">${icon('grip', 14)}</span>
        <div class="checkbox ${checkClass}" onclick="toggleDone('${t.id}')"></div>
        <div class="task-label-wrap" onclick="wrapClickToFocus(event, this)">
          <div class="task-label" contenteditable="true" data-done="${t.done}" spellcheck="false"
            oninput="updateLabel('${t.id}', this.textContent)"
            onblur="updateLabel('${t.id}', this.textContent.trim(), true)"
            onkeydown="handleTaskKeydown(event, '${t.id}')"
          >${linkify(t.label)}</div>
          ${hasNote ? `<span class="note-indicator" onclick="event.stopPropagation(); toggleNote('${t.id}')" title="Has a note (click to toggle)">${icon('pencil', 13)}</span>` : ''}
        </div>
        <div class="task-controls">
          <button class="task-btn note-btn ${noteOpen ? 'note-active' : ''}" onclick="toggleNote('${t.id}')" title="Toggle note">${icon('pencil', 13)}</button>
          <button class="task-btn" onclick="openTagModal('${t.id}')" title="Add tag">${icon('tag', 13)}</button>
          <button class="task-btn" onclick="setDue('${t.id}', event)" title="Set due date">${icon('calendar', 13)}</button>
          <button class="task-btn danger" onclick="deleteTask('${t.id}')" title="Delete">${icon('trash', 13)}</button>
        </div>
        <button class="task-menu-btn" onclick="toggleTaskMenu(event, '${t.id}')" title="More options" aria-label="Task options">${icon('more', 14)}</button>
        <div class="task-menu-popover" id="task-menu-${t.id}" onclick="event.stopPropagation()">
          <button class="task-menu-item" onclick="toggleNote('${t.id}'); closeAllTaskMenus();">${icon('pencil', 13)}<span>${noteOpen ? 'Hide note' : 'Add note'}</span></button>
          <button class="task-menu-item" onclick="setDue('${t.id}', event); closeAllTaskMenus();">${icon('calendar', 13)}<span>${t.due ? 'Change due date' : 'Set due date'}</span></button>
          <button class="task-menu-item" onclick="openTagModal('${t.id}'); closeAllTaskMenus();">${icon('tag', 13)}<span>Add tag</span></button>
          <div class="task-menu-divider"></div>
          <button class="task-menu-item" ${idx === 0 ? 'disabled' : ''} onclick="indentTask('${t.id}'); closeAllTaskMenus();">${icon('chevron-right', 13)}<span>Indent</span></button>
          <button class="task-menu-item" ${depth === 0 ? 'disabled' : ''} onclick="unindentTask('${t.id}'); closeAllTaskMenus();">${icon('chevron-left', 13)}<span>Outdent</span></button>
          <div class="task-menu-divider"></div>
          <button class="task-menu-item danger" onclick="deleteTask('${t.id}'); closeAllTaskMenus();">${icon('trash', 13)}<span>Delete</span></button>
        </div>
        ${expandToggle}
        <button class="star-toggle ${t.shortlisted ? 'starred' : ''}" onclick="toggleStar('${t.id}')" title="${t.shortlisted ? "Remove from Today's Shortlist" : "Add to Today's Shortlist"}">${icon('star', 14)}</button>
        ${t.id === pendingDeleteId ? `
          <div class="delete-confirm">
            <button class="delete-confirm-btn cancel" onclick="cancelDelete()" title="Cancel">${icon('x', 13)}</button>
            <button class="delete-confirm-btn confirm" onclick="confirmDelete('${t.id}')" title="Confirm delete">${icon('check', 13)}</button>
          </div>
        ` : ''}
      </div>
      ${(t.tags && t.tags.length) || t.due ? `
      <div class="task-meta">
        ${(t.tags||[]).map(tag => `<span class="tag-pill" onclick="removeTag('${t.id}','${esc(tag)}')">${esc(tag)} <span class="remove-tag">×</span></span>`).join('')}
        ${t.due ? `<span class="due-badge ${dueBadgeClass(t.due)}" onclick="setDue('${t.id}', event)" title="Click to edit">${formatDue(t.due)}</span>` : ''}
      </div>` : ''}
      <div class="task-note-area" id="note-${t.id}" style="${noteOpen ? '' : 'display:none;'}">
        <div class="task-note" contenteditable="true" data-placeholder="Add a note…" spellcheck="true"
          oninput="updateNote('${t.id}', this.innerText)"
          onblur="updateNote('${t.id}', this.innerText, true)"
        >${linkify(t.note || '')}</div>
      </div>
    `;

    container.appendChild(li);

    // Render the children's subtask-list unless this task is collapsed.
    if (hasChildren && !isCollapsed) {
      const subUl = document.createElement('ul');
      subUl.className = 'subtask-list checklist';
      subUl.dataset.parentId = t.id;
      renderTaskList(t.children, subUl, depth + 1);
      container.appendChild(subUl);
    }
  });
}

function renderChecklist() {
  const w = currentWeek();
  const ul = document.getElementById('checklist');
  ul.innerHTML = '';
  if (!w) { renderShortlist(); return; }
  renderTaskList(w.tasks, ul, 0);
  initTaskSortable();
  renderShortlist();
}

// ─── TODAY'S SHORTLIST ────────────────────────────────────────────────────────
// A separate above-the-fold list of tasks the user has starred as being
// "for today". Tasks are the same underlying objects as in the main tree —
// toggling done in either place updates both, because both views hang off
// the same t.done flag and both are re-rendered whenever anything changes.
//
// The user's chosen order for the top-level shortlist entries is persisted
// per-week as w.shortlistOrder (an array of task ids). We reconcile this
// against the live starred-tasks set on every read: stale ids drop out,
// newly-starred tasks are appended to the end. Nested items (subtasks
// brought along under a starred parent) always follow their parent's
// natural tree order and aren't user-reorderable.
function toggleStar(id) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (!t) return;
  t.shortlisted = !t.shortlisted;
  save();
  renderChecklist();
}

// Walk the tree and collect the top-level shortlist entries: tasks that are
// starred AND have no starred ancestor. A starred descendant of a starred
// task doesn't get its own top-level entry — it appears nested under its
// ancestor instead (so it isn't shown twice).
function collectShortlistRoots(tasks) {
  const roots = [];
  (function walk(list, hasStarredAncestor) {
    list.forEach(t => {
      if (t.shortlisted && !hasStarredAncestor) roots.push(t);
      if (t.children && t.children.length) {
        walk(t.children, hasStarredAncestor || !!t.shortlisted);
      }
    });
  })(tasks, false);
  return roots;
}

// Reconcile w.shortlistOrder with the current set of starred roots and
// return the roots sorted by that order. Mutates w.shortlistOrder: prunes
// ids that no longer belong (unstarred, deleted, or now nested under a
// starred ancestor) and appends any newly-starred roots at the end.
function collectShortlistRootsOrdered(w) {
  const roots = collectShortlistRoots(w.tasks);
  if (!w.shortlistOrder) w.shortlistOrder = [];
  const rootIds = new Set(roots.map(r => r.id));
  w.shortlistOrder = w.shortlistOrder.filter(id => rootIds.has(id));
  roots.forEach(r => { if (!w.shortlistOrder.includes(r.id)) w.shortlistOrder.push(r.id); });
  const orderIdx = new Map(w.shortlistOrder.map((id, i) => [id, i]));
  roots.sort((a, b) => orderIdx.get(a.id) - orderIdx.get(b.id));
  return roots;
}

// Drag-and-drop reordering for root shortlist items, via SortableJS — same
// rationale and general approach as the main checklist's initTaskSortable()
// above. Only root items are draggable (nested items follow their parent's
// tree order and never had a drag handle to begin with — see the .spacer
// comment in renderShortlistItems), so this only ever needs ONE Sortable
// instance on the single root list, no cross-list `group` needed.
function handleShortlistSortEnd() {
  const w = currentWeek(); if (!w) return;
  w.shortlistOrder = Array.from(document.getElementById('shortlist-items').children)
    .filter(li => li.classList.contains('shortlist-item'))
    .map(li => li.dataset.id);
  save();
  renderShortlist();
}

function initShortlistSortable() {
  const list = document.getElementById('shortlist-items');
  if (!list) return;
  Sortable.create(list, {
    handle: '.drag-handle:not(.spacer)',
    animation: 150,
    ghostClass: 'sortable-ghost',
    chosenClass: 'dragging',
    fallbackOnBody: true,
    onEnd: handleShortlistSortEnd
  });
}

// Starring a task pulls its entire subtree into the shortlist, but those
// subtrees start collapsed so the shortlist stays compact. This flag is
// separate from the main-list `collapsed` flag so users can have a task
// expanded in the main list but folded up in the shortlist (and vice versa).
// Undefined is treated as collapsed, so freshly-starred parents are folded
// by default without needing a migration.
function toggleShortlistCollapse(id) {
  const w = currentWeek(); if (!w) return;
  const t = findTask(w.tasks, id);
  if (!t) return;
  const wasCollapsed = t.shortlistCollapsed !== undefined ? !!t.shortlistCollapsed : true;
  t.shortlistCollapsed = !wasCollapsed;
  save();
  renderShortlist();
}

// Recursive renderer for shortlist entries. Only individually-starred tasks
// show a star (clickable to unstar and remove them from the shortlist);
// brought-along descendants have no star since their presence is derived
// from an ancestor's shortlisted flag. Every item with children gets an
// expand chevron that toggles just its own shortlist collapse state.
// Only root-level items (isRoot=true) are draggable — nested items follow
// their parent's tree order.
function renderShortlistItems(tasks, container, isRoot) {
  tasks.forEach(t => {
    const hasChildren = t.children && t.children.length > 0;
    const isPartial = hasChildren && t.children.some(c => c.done) && !t.children.every(c => c.done);
    const checkClass = t.done ? 'checked' : (isPartial ? 'partial' : '');
    const isCollapsed = t.shortlistCollapsed !== undefined ? !!t.shortlistCollapsed : true;
    const starHtml = t.shortlisted
      ? `<button class="star-toggle starred" onclick="toggleStar('${t.id}')" title="Remove from Today's Shortlist">${icon('star', 14)}</button>`
      : '';
    const chevronHtml = hasChildren
      ? `<button class="expand-toggle" onclick="toggleShortlistCollapse('${t.id}')" title="${isCollapsed ? 'Expand' : 'Collapse'}">${icon(isCollapsed ? 'chevron-left' : 'chevron-down', 14)}</button>`
      : '';
    // Root rows reserve leading space for a drag handle (only root items are
    // draggable — see comment above). Nested rows render the identical
    // element so every row has the same leading width before the checkbox,
    // just with "spacer" added so it stays permanently invisible and inert
    // instead of the normal hover-to-reveal behavior. Without this, a nested
    // row's checkbox lands almost exactly where its parent's does — losing
    // the drag handle's ~26px of reserved space nearly cancels out the 24px
    // indent from .shortlist-subitems > .shortlist-item, so the indent
    // becomes invisible even though the CSS padding is correctly applied.
    const gripHtml = isRoot
      ? `<span class="drag-handle" title="Drag to reorder">${icon('grip', 14)}</span>`
      : `<span class="drag-handle spacer" aria-hidden="true">${icon('grip', 14)}</span>`;
    const li = document.createElement('li');
    li.className = 'shortlist-item';
    li.dataset.id = t.id;
    // Indent for nested items comes from CSS alone now (.shortlist-subitems >
    // .shortlist-item), which correctly compounds at every nesting depth —
    // see the comment above that rule. No inline style needed here.
    // Draggability (root items only) is wired up by initShortlistSortable()
    // (SortableJS) once, on the whole list, after rendering — not per-item here.
    li.innerHTML = `
      <div class="shortlist-item-row">
        ${gripHtml}
        <div class="checkbox ${checkClass}" onclick="toggleDone('${t.id}')"></div>
        <div class="shortlist-label" contenteditable="true" data-done="${t.done}" spellcheck="false"
          oninput="updateLabel('${t.id}', this.textContent)"
          onblur="updateLabel('${t.id}', this.textContent.trim(), true)"
          onkeydown="handleShortlistLabelKeydown(event)"
        >${linkify(t.label)}</div>
        ${chevronHtml}
        ${starHtml}
      </div>
    `;
    container.appendChild(li);
    if (hasChildren && !isCollapsed) {
      const subUl = document.createElement('ul');
      subUl.className = 'shortlist-subitems';
      renderShortlistItems(t.children, subUl, false);
      // Append the nested list INSIDE the LI (not as a sibling in container).
      // Sibling ul-in-ul is invalid HTML and browsers render it inconsistently;
      // nesting the ul inside the parent li is the correct list structure, and
      // has the added bonus that dragging a root item visually carries its
      // whole subtree in the drag preview.
      li.appendChild(subUl);
    }
  });
}

function renderShortlist() {
  const box = document.getElementById('shortlist');
  const list = document.getElementById('shortlist-items');
  const w = currentWeek();
  if (!w) { box.style.display = 'none'; return; }
  const roots = collectShortlistRootsOrdered(w);
  if (roots.length === 0) { box.style.display = 'none'; return; }
  box.style.display = '';
  list.innerHTML = '';
  renderShortlistItems(roots, list, true);
  initShortlistSortable();
}

    e.preventDefault();
    openSearchModal();
    return;

    closeWeekModal();
    closeTagModal();
    closeSearchModal();
    const tp = document.getElementById('theme-popover');
    if (tp) tp.classList.remove('open');
  }
});
document.getElementById('week-modal').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveWeekModal();
});

  const el = document.getElementById('drive-status');
  el.textContent = text || '';
  el.className = 'drive-status' + (cls ? ' ' + cls : '');
}
function setDriveButton(label, connected, busy) {
  document.getElementById('drive-btn-label').textContent = label;
  const btn = document.getElementById('drive-btn');
  btn.classList.toggle('connected', !!connected);
  btn.disabled = !!busy;
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function driveEnsureLibsLoaded() {
  if (!driveGisReady) {
    await loadScriptOnce('https://accounts.google.com/gsi/client');
    driveGisReady = true;
  }
  if (!driveGapiReady) {
    await loadScriptOnce('https://apis.google.com/js/api.js');
    await new Promise((resolve) => gapi.load('picker', resolve));
    driveGapiReady = true;
  }
}

function driveGetTokenClient() {
  if (!driveTokenClient) {
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: () => {} // replaced per-request in driveRequestToken
    });
  }
  return driveTokenClient;
}

// Wraps GIS's callback-based token request in a Promise. interactive:false asks
// for a silent (no popup) refresh — used to quietly reconnect on page load when
// the browser still has a trusted Google session; it can simply fail, which just
// means the user needs to click "Connect Drive" again (e.g. after the 7-day
// re-auth window Google enforces while this app is in Testing mode).
function driveRequestToken(interactive) {
  return new Promise((resolve, reject) => {
    const client = driveGetTokenClient();
    client.callback = (resp) => {
      if (resp && resp.access_token) {
        driveAccessToken = resp.access_token;
        driveTokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
        resolve(resp.access_token);
      } else {
        reject(resp && resp.error ? new Error(resp.error) : new Error('No access token'));
      }
    };
    client.error_callback = (err) => reject(err || new Error('Auth failed'));
    try { client.requestAccessToken(interactive ? { prompt: 'consent' } : { prompt: '' }); }
    catch (e) { reject(e); }
  });
}
async function driveEnsureToken(interactive) {
  if (driveAccessToken && Date.now() < driveTokenExpiresAt) return driveAccessToken;
  return driveRequestToken(interactive);
}

// ─── Drive REST calls (drive.file scope — plain fetch, no client library needed) ───
async function driveApiFetch(url, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + driveAccessToken });
  const res = await fetch(url, options);
  if (res.status === 401) throw new Error('drive-auth-expired');
  if (!res.ok) throw new Error('Drive API error: ' + res.status);
  return res;
}
async function driveCreateFile(content) {
  const boundary = 'wtboundary';
  const metadata = { name: DRIVE_FILE_NAME, mimeType: DRIVE_MIME };
  const body =
    '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
    '--' + boundary + '\r\nContent-Type: ' + DRIVE_MIME + '\r\n\r\n' + content + '\r\n' +
    '--' + boundary + '--';
  const res = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method: 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
    body
  });
  return res.json();
}
async function driveUpdateFile(fileId, content) {
  const res = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media&fields=id,modifiedTime', {
    method: 'PATCH',
    headers: { 'Content-Type': DRIVE_MIME },
    body: content
  });
  return res.json();
}
async function driveGetFileMeta(fileId) {
  const res = await driveApiFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?fields=id,name,modifiedTime,trashed');
  return res.json();
}
async function driveGetFileContent(fileId) {
  const res = await driveApiFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
  return res.text();
}

// ─── Picker — used only to choose an *existing* synced file from another device ───
function driveOpenPicker() {
  return new Promise((resolve) => {
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
      .setMimeTypes(DRIVE_MIME)
      .setMode(google.picker.DocsViewMode.LIST);
    const picker = new google.picker.PickerBuilder()
      .setOAuthToken(driveAccessToken)
      .setDeveloperKey(DRIVE_API_KEY)
      .addView(view)
      .setTitle('Choose your Weekly Tracker data file')
      .setCallback((data) => {
        if (data.action === google.picker.Action.PICKED) resolve(data.docs[0].id);
        else if (data.action === google.picker.Action.CANCEL) resolve(null);
      })
      .build();
    picker.setVisible(true);
  });
}

// ─── Small modal, reused for the connect choice and the sync-conflict prompt ───
function driveShowModal(title, text, buttons) {
  document.getElementById('drive-modal-title').textContent = title;
  document.getElementById('drive-modal-text').textContent = text;
  const btnRow = document.getElementById('drive-modal-btns');
  btnRow.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.accent ? ' btn-accent' : '');
    el.textContent = b.label;
    el.onclick = () => { driveCloseModal(); b.onClick(); };
    btnRow.appendChild(el);
  });
  document.getElementById('drive-modal').classList.add('open');
}
function driveCloseModal() { document.getElementById('drive-modal').classList.remove('open'); }

// ─── Main flows ─────────────────────────────────────────────────────────────
function driveButtonClick() {
  if (driveGetFileId() && driveAccessToken) { driveSyncNow(); return; }
  driveConnect();
}

async function driveConnect() {
  if (driveConnectFlowActive) return;
  driveConnectFlowActive = true;
  setDriveButton('Connecting…', false, true);
  setDriveStatus('');
  try {
    await driveEnsureLibsLoaded();
    await driveRequestToken(true); // interactive — shows Google's consent popup
    const existingId = driveGetFileId();
    if (existingId) {
      await driveSyncNow();
    } else {
      setDriveButton('Connect Drive', false, false);
      driveShowModal(
        'Connect Google Drive',
        'Is this the first device you\'re connecting, or do you already have Weekly Tracker data synced from another device?',
        [
          { label: 'I have existing data', accent: false, onClick: driveConnectExisting },
          { label: 'Start fresh here', accent: true, onClick: driveConnectFresh }
        ]
      );
    }
  } catch (e) {
    setDriveButton('Connect Drive', false, false);
    setDriveStatus('Couldn\'t connect — try again', 'error');
  } finally {
    driveConnectFlowActive = false;
  }
}

async function driveConnectFresh() {
  setDriveButton('Setting up…', false, true);
  try {
    const meta = await driveCreateFile(JSON.stringify(state));
    driveSetFileId(meta.id);
    driveSetLastRemoteModified(meta.modifiedTime);
    setDriveButton('Sync now', true, false);
    setDriveStatus('Connected — synced just now');
  } catch (e) {
    setDriveButton('Connect Drive', false, false);
    setDriveStatus('Setup failed — try again', 'error');
  }
}

async function driveConnectExisting() {
  setDriveButton('Choose file…', false, true);
  try {
    const fileId = await driveOpenPicker();
    if (!fileId) { setDriveButton('Connect Drive', false, false); return; }
    const meta = await driveGetFileMeta(fileId);
    const remoteContent = await driveGetFileContent(fileId);
    let remoteState;
    try { remoteState = JSON.parse(remoteContent); } catch (e) { throw new Error('That file isn\'t Weekly Tracker data'); }
    driveSetFileId(fileId);
    driveApplyRemoteState(remoteState);
    driveSetLastRemoteModified(meta.modifiedTime);
    setDriveButton('Sync now', true, false);
    setDriveStatus('Connected — loaded your synced data');
  } catch (e) {
    setDriveButton('Connect Drive', false, false);
    setDriveStatus(e.message || 'Couldn\'t load that file', 'error');
  }
}

function driveApplyRemoteState(remoteState) {
  state = remoteState;
  localStorage.setItem('wt_state', JSON.stringify(state));
  renderSidebar();
  if (state.currentWeekId) {
    const w = state.weeks.find(w => w.id === state.currentWeekId);
    if (w) selectWeek(w.id, false);
  } else {
    document.getElementById('empty-state').style.display = '';
  }
}

// Manual "Sync now", and the background check right after reconnecting: reads
// the remote file's timestamp first; if it's newer than the last version this
// device knows about, another device saved more recently, so we ask before
// overwriting anything. Otherwise this device's state is pushed up as-is.
async function driveSyncNow() {
  const fileId = driveGetFileId();
  if (!fileId || driveSyncInFlight) return;
  driveSyncInFlight = true;
  setDriveButton('Syncing…', true, true);
  setDriveStatus('Syncing…', 'syncing');
  try {
    await driveEnsureToken(false);
    const meta = await driveGetFileMeta(fileId);
    const lastKnown = driveGetLastRemoteModified();
    if (meta.modifiedTime && lastKnown && meta.modifiedTime !== lastKnown) {
      setDriveButton('Sync now', true, false);
      setDriveStatus('Newer data found on Drive', 'error');
      driveShowModal(
        'Newer data on Drive',
        'Another device saved changes to Drive more recently than this one. Load that version, or overwrite it with what\'s on this device?',
        [
          { label: 'Overwrite with this device', accent: false, onClick: () => drivePush(fileId) },
          { label: 'Load Drive\'s version', accent: true, onClick: () => drivePull(fileId) }
        ]
      );
      return;
    }
    await drivePush(fileId);
  } catch (e) {
    setDriveButton('Sync now', true, false);
    setDriveStatus(e.message === 'drive-auth-expired' ? 'Reconnect needed' : 'Sync failed', 'error');
  } finally {
    driveSyncInFlight = false;
  }
}
async function drivePush(fileId) {
  const meta = await driveUpdateFile(fileId, JSON.stringify(state));
  driveSetLastRemoteModified(meta.modifiedTime);
  setDriveButton('Sync now', true, false);
  setDriveStatus('Synced just now');
}
async function drivePull(fileId) {
  const meta = await driveGetFileMeta(fileId);
  const remoteContent = await driveGetFileContent(fileId);
  driveApplyRemoteState(JSON.parse(remoteContent));
  driveSetLastRemoteModified(meta.modifiedTime);
  setDriveButton('Sync now', true, false);
  setDriveStatus('Loaded Drive\'s version');
}

// Debounced auto-save: after any local change, wait for a pause, then push
// quietly in the background — no spinner, no interruption. A no-op unless
// already connected with a live token, so nothing pops up uninvited.
function driveQueueAutoSync() {
  if (!driveGetFileId() || !driveAccessToken) return;
  clearTimeout(driveAutoSyncTimer);
  driveAutoSyncTimer = setTimeout(async () => {
    const fileId = driveGetFileId();
    if (!fileId || driveSyncInFlight) return;
    try {
      await driveEnsureToken(false);
      const meta = await driveUpdateFile(fileId, JSON.stringify(state));
      driveSetLastRemoteModified(meta.modifiedTime);
      setDriveStatus('Synced just now');
    } catch (e) {
      // Local save already succeeded regardless — the next manual "Sync now"
      // or the next auto-save retries. No need to surface this one quietly.
    }
  }, 2500);
}

// On load: if this device has connected before, try a silent (no popup)
// reconnect. Works quietly if the browser still has a trusted Google session;
// otherwise it fails silently and the button just sits at "Connect Drive".
(async function driveInit() {
  if (!driveGetFileId()) return;
  try {
    await driveEnsureLibsLoaded();
    await driveRequestToken(false);
    setDriveButton('Sync now', true, false);
    driveSyncNow();
  } catch (e) {
    setDriveButton('Connect Drive', false, false);
    setDriveStatus('Reconnect needed', 'error');
  }
})();

// ─── PWA ──────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// Install prompt banner
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 12px 18px; display: flex; align-items: center;
    gap: 12px; z-index: 9999; font-family: var(--font); font-size: 13px; color: var(--text);
    white-space: nowrap;
  `;
  banner.innerHTML = `
    <span>📲 Install Weekly Tracker as an app</span>
    <button onclick="installApp()" style="padding:6px 14px;border-radius:var(--radius);background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;">Install</button>
    <button onclick="this.closest('#install-banner').remove()" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;line-height:1;padding:2px 4px;">×</button>
  `;
  document.body.appendChild(banner);
}

async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  const banner = document.getElementById('install-banner');
  if (banner) banner.remove();
}

// Update theme-color meta when dark mode toggles
const _origToggleDark = toggleDark;
window.toggleDark = function() {
  _origToggleDark();
  document.getElementById('theme-meta').content = document.body.classList.contains('dark') ? '#141412' : '#2d6a4f';
};
</script>
